<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#FFF8E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<title>우리 가족 기록장</title>
<style>
:root{
  --cream:#FFFDF2;
  --card:#FFFDF8;
  --mint:#E4F6EC;
  --mint-2:#D3EFE0;
  --mint-d:#8FD3B0;
  --yellow:#FFF2C9;
  --yellow-2:#FFE9A8;
  --yellow-d:#F3C73F;
  --pink:#FFE6EE;
  --pink-2:#FFD7E4;
  --pink-d:#F09CB4;
  --blue:#EAF4FD;
  --blue-2:#D9EAFA;
  --blue-d:#9CC3E6;
  --ink:#5A4636;
  --ink-2:#8B7460;
  --ink-3:#B5A18C;
  --line:#F0E4D3;
  --shadow:0 8px 20px rgba(168,138,105,.09);
  --shadow-sm:0 4px 12px rgba(168,138,105,.07);
  --r:24px;
  --r-sm:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  background-color:var(--cream);
  background-image:
    radial-gradient(900px 520px at 50% -8%, #FFF4D3 0%, rgba(255,244,211,0) 62%),
    radial-gradient(620px 460px at 104% 26%, #FFEEF4 0%, rgba(255,238,244,0) 58%),
    radial-gradient(620px 460px at -4% 64%, #E9F8F0 0%, rgba(233,248,240,0) 58%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#C9B7A4}
svg{display:block}
.app{max-width:440px;margin:0 auto;padding:0 16px 112px}

/* ---------- header ---------- */
.hd{padding:18px 0 2px}
.hd-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd-title{display:flex;align-items:center;gap:6px;font-size:25px;font-weight:900;letter-spacing:-.8px;line-height:1.2;white-space:nowrap;min-width:0}
.hd-title .t1{color:#AD8A67}
.hd-title .t2{color:#F19AB3}
.hd-mascot{width:30px;height:30px;flex:0 0 30px}
.hd-row2{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px}
.hd-meta{min-width:0}
.hd-date{font-size:13.5px;font-weight:700;color:var(--ink-2);line-height:1.35}
.hd-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.hd-btns{display:flex;gap:6px;flex:0 0 auto}
@media (max-width: 392px){
  .hd-title{font-size:22px;letter-spacing:-.6px}
  .hd-mascot{width:26px;height:26px;flex:0 0 26px}
  .hd-pill{font-size:10.5px;padding:6px 9px}
  .app{padding-left:13px;padding-right:13px}
  .card{padding:14px}
}
.round-btn{width:42px;height:42px;border-radius:16px;background:#fff;border:1px solid #fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;cursor:pointer;transition:transform .12s}
.round-btn:active{transform:scale(.94)}
.hd-pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:0;border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:700;color:#A98A5F;box-shadow:var(--shadow-sm);white-space:nowrap;cursor:pointer}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85);margin-bottom:14px}
.card--mint{background:linear-gradient(170deg,#F0FBF5,#E1F5EA 60%,#E7F7EE)}
.card--sun{background:linear-gradient(160deg,#FFFDF4,#FFF5DE)}
.card--sky{background:linear-gradient(150deg,#F5FAFF,#E9F3FF 55%,#F2FBF5)}
.card--pink{background:linear-gradient(160deg,#FFF8FA,#FFECF3)}
.card--peach{background:linear-gradient(160deg,#FFF8EE,#FFEFE2)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-title{font-size:16px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.card-desc{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:2px 0 10px}
.mini-pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--ink-2);box-shadow:var(--shadow-sm);white-space:nowrap}
.mini-pill--pink{color:#C2697F;background:#FFF3F6}
.mini-pill--mint{color:#3E8A66;background:#EDFAF2}
.btn{appearance:none;border:0;cursor:pointer;border-radius:15px;background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);padding:11px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13.5px;transition:transform .12s,filter .12s;line-height:1.2;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn--mint{background:linear-gradient(180deg,#E7F9EF,#D3EFE0);color:#31795A}
.btn--pink{background:linear-gradient(180deg,#FFEAF1,#FFD9E5);color:#B85A76}
.btn--sky{background:linear-gradient(180deg,#EDF6FF,#DCEBFA);color:#3D6A94}
.btn--sun{background:linear-gradient(180deg,#FFF7DF,#FFEDB8);color:#8D6A20}
.btn--ghost{background:#F6EFE4;box-shadow:none;color:var(--ink-2)}
.btn--rose{background:linear-gradient(180deg,#FFD3E0,#FFB9CE);color:#8E3552;box-shadow:0 6px 14px rgba(240,156,180,.28)}
.btn--block{width:100%}
.btn--sm{padding:8px 11px;font-size:12.5px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;cursor:pointer;flex:0 0 34px;transition:transform .12s}
.iconbtn:active{transform:scale(.93)}
.iconbtn--pin{background:#FFF6D9;border-color:#F5E3A8}
.iconbtn--del{color:#D96A5E}
.empty{font-size:12.5px;color:var(--ink-3);padding:10px 2px;text-align:center}
.foot-note{font-size:11.5px;color:var(--ink-3);text-align:center;padding:4px 6px 10px;line-height:1.6}
.divider{height:1px;background:var(--line);margin:10px 0}
.dash-sep{height:1px;background-image:linear-gradient(90deg,#E9DCC8 45%,rgba(255,255,255,0) 0);background-size:9px 1px;background-repeat:repeat-x;margin:8px 0}

/* ---------- inputs ---------- */
.field{width:100%;border:1.5px solid #EFE1CD;background:#fff;border-radius:14px;padding:11px 12px;font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s}
.form-row .field{width:auto;flex:1 1 auto;min-width:0}
.field:focus{border-color:#EBC98E;box-shadow:0 0 0 3px rgba(243,199,63,.14)}
.field--sm{padding:8px 10px;font-size:13px;border-radius:11px}
textarea.field{resize:vertical;min-height:64px}
.add-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.add-row .field{flex:1 1 120px;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--ink-2)}
.tiny{font-size:11.5px;color:var(--ink-3)}

/* ---------- weather ---------- */
.weather{position:relative;overflow:hidden;border-radius:var(--r);padding:15px 16px;margin-bottom:14px;background:linear-gradient(135deg,#F4FAFF,#EAF4FF 52%,#F6FBF3);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9)}
.weather-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weather-city{font-size:14px;font-weight:900;color:#54718C}
.weather-temp{font-size:26px;font-weight:900;color:#3D6A94;letter-spacing:-1px;line-height:1}
.weather-desc{font-size:13px;font-weight:800;color:#54718C}
.weather-range{font-size:12px;color:#7E96AC;font-weight:600}
.weather-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.weather-note{font-size:11px;color:#8FA6BA}
.weather-err{font-size:12.5px;color:#9A7C63;line-height:1.5}
.weather-emo{font-size:22px;line-height:1}

/* ---------- family ---------- */
.fam{display:flex;align-items:center;gap:11px;background:#fff;border-radius:20px;padding:11px 12px;box-shadow:var(--shadow-sm);margin-bottom:9px}
.fam:last-child{margin-bottom:0}
.fam-av{width:52px;height:52px;flex:0 0 52px;border-radius:19px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.fam-av--sm{width:36px;height:36px;flex:0 0 36px;border-radius:13px}
.fam-av--xs{width:26px;height:26px;flex:0 0 26px;border-radius:10px}
.fam-info{flex:1 1 auto;min-width:0}
.fam-name{font-size:16px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:5px}
.fam-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.fam-r{text-align:right;flex:0 0 auto}
.stars{font-size:14.5px;font-weight:900;color:#8A6A3F;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.stars svg{flex:0 0 auto}
.piggy{font-size:12px;font-weight:800;color:#B0738C;margin-top:2px;white-space:nowrap}

/* ---------- 받고 싶은 선물 · 도장 목표 ---------- */
.fam-name{flex-wrap:wrap;row-gap:3px}
.gift-chip{display:inline-flex;align-items:center;gap:3px;border:0;cursor:pointer;background:#FFF2DC;color:#A9713A;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:900;line-height:1.3;max-width:100%;box-shadow:var(--shadow-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.gift-chip:active{transform:scale(.96)}
.gift-chip--empty{background:#FFFDF6;color:#B99A7A;border:1.5px dashed #E7D6BF;box-shadow:none;font-weight:800}
.gift-chip--rose{background:linear-gradient(180deg,#FFE2EC,#FFD2E1);color:#B0516F;box-shadow:0 3px 8px rgba(240,156,180,.24)}
.fam-goal{margin-top:6px;display:flex;align-items:center;gap:7px}
.fam-goal .goal-bar{flex:1 1 auto;height:7px}
.fam-goal-num{font-size:10.5px;font-weight:900;color:#A9713A;white-space:nowrap}
.goal-block{margin-top:12px;background:#fff;border-radius:18px;padding:12px;border:1.5px solid #F6E4C2;box-shadow:var(--shadow-sm)}
.goal-block.on{border-color:#F7BDD0;background:linear-gradient(170deg,#FFF9FB,#FFEEF4)}
.goal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.goal-title{font-size:13px;font-weight:900;color:#96703A}
.goal-num{font-size:13.5px;font-weight:900;color:#8A6A2A;white-space:nowrap}
.goal-num b{color:#C2697F}
.goal-bar{display:block;height:12px;border-radius:999px;background:#EFE7D8;overflow:hidden}
.goal-bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFD98A,#F5A8C0);transition:width .35s ease}
.goal-bar > i.done{background:linear-gradient(90deg,#8FD3B0,#F5A8C0)}
.goal-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.goal-done{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap;background:#FFF0F5;border:1.5px solid #F7C3D4;border-radius:15px;padding:9px 11px}
.goal-done-txt{font-size:13.5px;font-weight:900;color:#C0557B}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #EFE4D4;font-size:13px}
.hist-row:last-child{border-bottom:0}
.hist-main{flex:1 1 auto;min-width:0}
.hist-gift{font-weight:800;word-break:break-word}
.hist-sub{font-size:11px;color:var(--ink-3);margin-top:1px}

/* ---------- kid switch ---------- */
.switch{display:flex;gap:6px;background:rgba(255,255,255,.7);padding:4px;border-radius:15px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 6px;font-size:13px;font-weight:800;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.switch button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.switch .dot{width:8px;height:8px;border-radius:50%}

/* ---------- stamps ---------- */
.flame{background:#FFF4E6;border:1.5px solid #FFDDB8;color:#C07A34;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.stamps{display:flex;gap:4px;margin:10px 0 12px}
.stamp-day{flex:1 1 0;text-align:center;min-width:0}
.stamp-dow{font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:5px}
.stamp-slot{width:100%;aspect-ratio:1/1;border-radius:50%;border:2px dashed #E8D9C2;background:#FFFCF3;display:grid;place-items:center;padding:3px;overflow:hidden}
.stamp-slot.on{border:2px solid #F3C73F;background:#FFF8E0;box-shadow:0 2px 6px rgba(243,199,63,.25)}
.stamp-slot.today{border-color:#9CC3E6}
.stamp-slot.today.on{border-color:#F3C73F;box-shadow:0 0 0 2px #9CC3E6}
.stamp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- mission ---------- */
.mission-emoji{font-size:34px;line-height:1;margin:6px 0 4px}
.mission-text{font-size:18px;font-weight:900;letter-spacing:-.4px;margin-bottom:12px}
.mission-btns{display:flex;gap:8px}
.mission-btns .btn{flex:1 1 0;font-size:13.5px;padding:12px 8px}

/* ---------- todo ---------- */
.todo-card{border-radius:20px;border:1.5px solid var(--line);background:#fff;padding:12px;margin-bottom:10px}
.todo-card:last-child{margin-bottom:0}
.todo-hd{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.todo-name{font-size:15px;font-weight:900}
.todo-sub{font-size:11.5px;color:var(--ink-3);font-weight:600}
.todo-items{margin-top:6px}
.todo-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed #EFE4D4}
.todo-row:last-child{border-bottom:0}
.todo-txt{flex:1 1 auto;font-size:14px;min-width:0;word-break:break-word}
.todo-txt.done{color:#BCAE9C;text-decoration:line-through}
.chk{width:25px;height:25px;flex:0 0 25px;border-radius:8px;border:2px solid #E4D6C3;background:#fff;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:14px;font-weight:900;line-height:1}
.chk.on{background:#5CBD84;border-color:#5CBD84;box-shadow:0 2px 6px rgba(92,189,132,.32)}
.chk--blue.on{background:#5A9BD8;border-color:#5A9BD8}
.add-dash{width:100%;border:1.5px dashed #E7D8C3;background:#FFFCF6;border-radius:13px;padding:9px;font-size:12.5px;font-weight:800;color:#A98A6B;cursor:pointer;margin-top:6px}
.add-dash:active{background:#FFF7E9}

/* ---------- routine ---------- */
.progress-wrap{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.bar{flex:1 1 auto;height:11px;border-radius:999px;background:#EFE7D8;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#93D8B6,#68C2DB);transition:width .35s ease}
.progress-num{font-size:12.5px;font-weight:900;color:#4E7C93;white-space:nowrap}
.study-kid{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.study-money{margin-left:auto;background:#FFF6D9;border:1px solid #F6E4AE;color:#8A6A2A;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:900;white-space:nowrap}
.study-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px dashed #EFE4D4;flex-wrap:wrap}
.study-row:last-child{border-bottom:0}
.study-name{flex:1 1 120px;font-size:14px;min-width:0;word-break:break-word}
.study-name.done{color:#BCAE9C;text-decoration:line-through}
.chip-amount{background:#FFF4D6;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:900;color:#8A6A2A;white-space:nowrap}
.chip-fixed{background:#EAF7F1;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;color:#4A8567;white-space:nowrap}
.study-acts{display:flex;gap:5px;margin-left:auto}

/* ---------- timer ---------- */
.timer-modes{display:flex;gap:5px;background:rgba(255,255,255,.8);padding:4px;border-radius:14px;margin:4px 0 10px}
.timer-modes button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-size:12.5px;font-weight:800;color:var(--ink-3);cursor:pointer}
.timer-modes button.on{background:#fff;color:#31527A;box-shadow:var(--shadow-sm)}
.timer-sub{font-size:12px;color:var(--ink-2);text-align:center;font-weight:700}
.timer-time{font-size:54px;font-weight:900;letter-spacing:1px;color:#2F4C7A;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05;margin:5px 0 12px}
.timer-time.done{color:#D96A5E}
.timer-btns{display:flex;gap:8px}
.timer-btns .btn{flex:1 1 0}
.presets{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.preset{border:1.5px solid #D3E4F5;background:#fff;color:#3D6A94;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer}
.preset.on{background:#DCEBFA;border-color:#9CC3E6}
.timer-custom{display:flex;gap:5px;align-items:center;width:100%;margin-top:6px}
.timer-custom input{flex:1 1 auto;min-width:0;text-align:center}
.timer-custom .btn{flex:0 0 92px}

/* ---------- meals ---------- */
.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #EFE4D4}
.meal:last-child{border-bottom:0}
.meal-emo{font-size:22px;width:28px;text-align:center;flex:0 0 28px}
.meal-label{font-size:13px;font-weight:900;color:var(--ink-2);width:44px;flex:0 0 44px}
.meal input{flex:1 1 auto;min-width:0}

/* ---------- schedule ---------- */
.ev{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed #EFE4D4}
.ev:last-child{border-bottom:0}
.ev-date{flex:0 0 54px;text-align:center;background:#FFF7E2;border-radius:11px;padding:4px 2px;font-size:11px;font-weight:900;color:#96703A;line-height:1.25}
.ev-date.past{background:#F4EEE4;color:#A28F79}
.ev-main{flex:1 1 auto;min-width:0}
.ev-title{font-size:14px;font-weight:700;word-break:break-word}
.ev-title.done{color:#BCAE9C;text-decoration:line-through}
.ev-sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.dday{background:#FFE9F0;color:#C2697F;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:900;white-space:nowrap}
.dday--today{background:#E8F7EF;color:#3E8A66}
.dday--past{background:#F2EDE5;color:#A28F79}

/* ---------- health ---------- */
.health-card{border-radius:20px;padding:12px;background:#fff;border:1.5px solid var(--line);margin-bottom:10px}
.health-hd{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.health-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid #EBDDC9;background:#FFFDF7;border-radius:13px;padding:9px 8px;font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;text-align:left;line-height:1.2}
.chip.on{background:#E6F7EE;border-color:#A9DCBF;color:#31795A}
.chip .cemo{font-size:15px}

/* ---------- praise ---------- */
.praise{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow-sm);margin-bottom:9px;border:1.5px solid #FBEFF2}
.praise-hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
.praise-text{font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.praise-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.star-badge{background:#FFF6D9;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:900;color:#8A6A2A}
.form-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.form-row label{font-size:12px;font-weight:800;color:var(--ink-2);flex:0 0 34px}
select.field{padding:10px 8px;height:44px;background:#fff}
.check-line{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:2px 0 10px}
.check-line input{width:18px;height:18px;accent-color:#F3A9C0}

/* ---------- money ---------- */
.money-big{font-size:38px;font-weight:900;letter-spacing:-1.5px;color:#9A6B2F;text-align:right;line-height:1.1}
.money-total{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
.money-label{font-size:13.5px;font-weight:900;color:#A97F4A}
.money-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mchip{background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--ink-2);box-shadow:var(--shadow-sm);white-space:nowrap}
.mchip b{font-weight:900;color:var(--ink)}
.money-start{display:flex;gap:6px;align-items:center}
.money-start .field{flex:1 1 auto;min-width:0}
.ledger{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed #EFE4D4;font-size:13px}
.ledger:last-child{border-bottom:0}
.lg-kind{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px}
.lg-kind.in{background:#E6F7EE;color:#37855F}
.lg-kind.out{background:#FFEDEC;color:#C4655A}
.lg-main{flex:1 1 auto;min-width:0}
.lg-memo{font-size:11px;color:var(--ink-3)}
.lg-amt{font-weight:900;white-space:nowrap}
.lg-amt.in{color:#37855F}
.lg-amt.out{color:#C4655A}
.day-sum{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed #EFE4D4;font-size:13px}
.day-sum:last-child{border-bottom:0}

/* ---------- chat ---------- */
.chat-note{background:#FFFBEA;border:1px solid #F6E9BF;border-radius:14px;padding:8px 11px;font-size:11.5px;color:#9A7C44;line-height:1.5;margin-bottom:10px}
.sender-row{display:flex;gap:6px;margin-bottom:8px}
.sender{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid #EFE1CD;background:#fff;border-radius:15px;padding:7px 3px;font-size:11px;font-weight:800;color:var(--ink-2);cursor:pointer;min-width:0}
.sender.on{border-color:#9CC3E6;background:#F2F9FF;color:#2F5A82;box-shadow:0 0 0 2px rgba(156,195,230,.25)}
.sender .fam-av{width:28px;height:28px;flex:0 0 28px;border-radius:11px}
.lock-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.lock-btn{display:flex;align-items:center;gap:6px;border:1.5px solid #E8DCC8;background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;color:var(--ink-2);cursor:pointer}
.lock-btn.on{background:#FFF4E6;border-color:#F3D2A4;color:#A5712C}
.chat-list{display:flex;flex-direction:column;gap:14px;min-height:180px;max-height:52vh;overflow-y:auto;padding:4px 2px 8px}
.msg{display:flex;gap:7px;align-items:flex-start}
.msg-av{width:32px;height:32px;flex:0 0 32px;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.msg-body{max-width:78%;min-width:0}
.msg-name{font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.bubble{background:#fff;border-radius:4px 17px 17px 17px;padding:9px 12px;font-size:14px;line-height:1.45;box-shadow:var(--shadow-sm);word-break:break-word;white-space:pre-wrap;border:1.5px solid #F7EFE3}
.bubble--taeju{background:#FFF8E6;border-color:#F8EBC8}
.bubble--juwon{background:#F8FCE6;border-color:#EDF3C9}
.bubble--mom{background:#FFF2F6;border-color:#FBDCE7}
.bubble--dad{background:#EFF7FF;border-color:#DAE9F8}
.sticker-bubble{background:transparent;border:0;box-shadow:none;padding:0}
.sticker-bubble svg{width:104px;height:104px;filter:drop-shadow(0 4px 8px rgba(168,138,105,.14))}
.sticker-cap{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-top:2px}
.msg-acts{display:flex;gap:5px;margin-top:5px}
.act{width:30px;height:26px;border-radius:9px;border:1.5px solid #EFE1CD;background:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center;color:#C08A8A}
.act.on{background:#FFE9F0;border-color:#F7B9CC;color:#D9547A}
.act--del{color:#C9A6A0}
.sticker-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.sticker-pick{border:1.5px solid #F0E4D3;background:#FFFDF7;border-radius:16px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.sticker-pick svg{width:100%;height:auto;max-width:62px}
.sticker-pick span{font-size:9.5px;color:var(--ink-3);font-weight:700}
.composer{position:sticky;bottom:0;background:rgba(255,253,246,.96);padding-top:8px;margin-top:6px;border-top:1px solid var(--line)}
.composer-row{display:flex;gap:6px;align-items:center}
.composer .field{flex:1 1 auto;min-width:0}
.send-btn{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:0;background:linear-gradient(180deg,#FFE3EC,#FFCFDD);color:#B85A76;font-size:17px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-sm)}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:40;pointer-events:none}
.tabbar-in{pointer-events:auto;width:100%;max-width:440px;display:grid;grid-template-columns:repeat(9,1fr);gap:1px;padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));background:rgba(255,253,247,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -6px 22px rgba(168,138,105,.10)}
.tab{border:0;background:transparent;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.2px;font-weight:800;color:#B5A18C;cursor:pointer;border-radius:13px;line-height:1.15;letter-spacing:-.4px;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:20px;height:20px}
@media (max-width:380px){.tab{font-size:8.6px}.tab svg{width:18px;height:18px}}
.tab.on{color:#7A5836;background:#FFF3CC}
.tab.on svg{stroke:#7A5836}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(74,56,38,.34);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .16s ease}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:#FFFDF7;border-radius:26px 26px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.3,1);box-shadow:0 -8px 30px rgba(90,70,50,.18)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheet-title{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px}
.sheet-close{width:34px;height:34px;border-radius:12px;border:0;background:#F4EDE2;color:#8B7460;font-size:16px;cursor:pointer}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions .btn{flex:1 1 0}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed #EFE4D4}
.settings-row:last-child{border-bottom:0}
.settings-row .lbl{font-size:13.5px;font-weight:800}
.settings-row .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cal-month{font-size:14px;font-weight:900}
.cal-nav{width:32px;height:32px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-size:10.5px;text-align:center;color:var(--ink-3);font-weight:800;padding-bottom:2px}
.cal-cell{aspect-ratio:1/1;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#FFFAF0;border:1px solid #F3EADA;color:#BBA793;position:relative;overflow:hidden;padding:2px}
.cal-cell.blank{background:transparent;border:0}
.cal-cell.on{background:#FFF6D9;border-color:#F3D98E;color:#8A6A2A}
.cal-cell.today{box-shadow:0 0 0 2px #9CC3E6 inset}
.cal-legend{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.legend-dot{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:4px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:rgba(90,70,54,.95);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;z-index:90;max-width:86%;text-align:center;box-shadow:0 8px 20px rgba(90,70,54,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 실시간 연동 상태 ---------- */
.sync-chip{display:inline-flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:7px 10px;font-size:10.5px;font-weight:800;color:#4E9A6B;box-shadow:var(--shadow-sm);white-space:nowrap;cursor:default;transition:background .2s}
.sync-chip.wait{color:#B48B3C}
.sync-chip.off{color:#B0766A}
.sync-chip.flash{animation:syncflash .5s ease 2}
@keyframes syncflash{0%{transform:scale(1);background:#fff}50%{transform:scale(1.09);background:#E8F8EE}100%{transform:scale(1);background:#fff}}
@media (max-width:360px){.sync-chip{padding:6px 7px;font-size:9.5px}}

/* ---------- 학원 숙제 ---------- */
.hw-sec{background:#fff;border-radius:16px;padding:9px 11px;margin-bottom:8px;border:1.5px solid #F4E7D4}
.hw-hd{display:flex;align-items:center;gap:6px;padding-bottom:2px}
.hw-badge{font-size:11.5px;font-weight:900;border-radius:999px;padding:3px 9px;color:#6B5544;white-space:nowrap}
.hw-count{font-size:11px;font-weight:800;color:#B5A18C;margin-left:auto;white-space:nowrap}
.hw-add{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:1.5px dashed #E3D2BC;background:#FFFCF5;color:#A98A6B;font-size:14px;font-weight:900;cursor:pointer;display:grid;place-items:center}
.hw-add:active{background:#FFF3E2}
.hw-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px dashed #F2E8D9}
.hw-row:last-child{border-bottom:0}
.hw-text{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word}
.hw-text.done{color:#BCAE9C;text-decoration:line-through}
.hw-due{font-size:10.5px;font-weight:900;color:#C2697F;background:#FFEFF4;border-radius:999px;padding:2px 7px;white-space:nowrap;flex:0 0 auto}
.hw-due.past{background:#F3EEE6;color:#A28F79}
.hw-due.today{background:#E8F7EF;color:#3E8A66}
.hw-empty{font-size:12px;color:#C0AF9C;padding:5px 2px}
.hw-total{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hw-mini{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:8px 10px;border:1.5px solid #F4E7D4;margin-bottom:7px}
.hw-mini:last-child{margin-bottom:0}
.hw-mini-nm{font-size:13px;font-weight:900;flex:0 0 auto}
.hw-mini-dots{display:flex;gap:5px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.hw-mini-dot{font-size:10.5px;font-weight:800;color:#8B7460;background:#FFF7EC;border-radius:999px;padding:2px 7px;white-space:nowrap}
.hw-mini-dot.all{background:#E8F7EF;color:#3E8A66}

/* ---------- 학교 급식 ---------- */
.lunch-school{background:#fff;border-radius:16px;padding:10px 11px;margin-bottom:8px;border:1.5px solid #E3ECF7}
.lunch-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lunch-nm{font-size:13.5px;font-weight:900}
.lunch-who{font-size:10.5px;font-weight:800;color:#7E96AC;background:#F2F8FF;border-radius:999px;padding:2px 8px}
.lunch-kcal{margin-left:auto;font-size:10.5px;font-weight:900;color:#B48B3C;background:#FFF7DF;border-radius:999px;padding:2px 8px;white-space:nowrap}
.lunch-menu{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.lunch-menu li{font-size:12px;font-weight:700;color:#5A6B7A;background:#F7FBFF;border:1px solid #E7F0FA;border-radius:9px;padding:3px 7px;line-height:1.3;max-width:100%;word-break:break-word}
.lunch-allergy{font-size:10.5px;color:#A9886B;margin-top:5px;line-height:1.4}
.lunch-day{display:flex;gap:7px;padding:6px 0;border-bottom:1px dashed #EDF3FA}
.lunch-day:last-child{border-bottom:0}
.lunch-day-date{flex:0 0 48px;font-size:11px;font-weight:900;color:#54718C;line-height:1.3}
.lunch-day-menu{flex:1 1 auto;font-size:12px;color:#5A6B7A;line-height:1.4;min-width:0;word-break:break-word}
.lunch-state{font-size:12px;color:#8FA6BA;padding:6px 0;line-height:1.45}
.lunch-note{font-size:11px;color:#8FA6BA;margin-top:3px;line-height:1.5}
.lunch-toggle{display:flex;gap:5px}
.lunch-toggle button{border:1.5px solid #D6E6F5;background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;color:#7E96AC;cursor:pointer;white-space:nowrap}
.lunch-toggle button.on{background:#DCEBFA;border-color:#9CC3E6;color:#3D6A94}

/* ---------- 성장 기록 ---------- */
.gp-sum{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap}
.gp-box{flex:1 1 84px;background:#fff;border-radius:14px;padding:8px 6px;border:1.5px solid #DCEDE3;text-align:center;min-width:0}
.gp-box .k{font-size:10.5px;font-weight:800;color:#8B7460}
.gp-box .v{font-size:16px;font-weight:900;color:#3E8A66;line-height:1.2;white-space:nowrap}
.gp-box .p{font-size:10.5px;font-weight:800;color:#7FA892}
.gp-chart{background:#fff;border-radius:16px;border:1.5px solid #DCEDE3;padding:8px 6px 4px;margin-bottom:8px}
.gp-chart svg{width:100%;height:auto;display:block}
.gp-cap{display:flex;justify-content:space-between;gap:6px;font-size:9.5px;color:#A6B9AC;padding:0 2px 4px;font-weight:800}
.gp-cap .mid{color:#7FA892}
.gp-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #E8F1EB;font-size:13px}
.gp-row:last-child{border-bottom:0}
.gp-date{flex:0 0 60px;font-size:11px;font-weight:900;color:#7FA892;line-height:1.3}
.gp-main{flex:1 1 auto;min-width:0}
.gp-main .n{font-size:13.5px;font-weight:800;word-break:break-word}
.gp-main .s{font-size:10.5px;color:#9FB3A6;margin-top:1px;line-height:1.4}
.gp-tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.gp-tab{border:1.5px solid #DCEDE3;background:#fff;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;color:#7FA892;cursor:pointer}
.gp-tab.on{background:#E6F7EE;border-color:#A9DCBF;color:#31795A}
.gp-birth{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px dashed #D9EBE0;border-radius:14px;padding:8px 10px;margin-bottom:9px}
.gp-birth .t{font-size:11.5px;font-weight:800;color:#7FA892;flex:0 0 auto}
.gp-birth input{flex:1 1 110px;min-width:0}

/* ---------- 발로란트 ---------- */
.val-accs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.val-acc{border:1.5px solid #F3D2DE;background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;color:#B85A76;cursor:pointer;white-space:nowrap}
.val-acc.on{background:#FFE9F1;border-color:#F0A9C0;color:#A24663}
.val-other{display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:8px;font-size:10.5px;color:#B08A9A;font-weight:800}
.val-accrow{display:flex;align-items:center;gap:7px;width:100%;background:#fff;border:1.5px solid #F3E4EA;border-radius:14px;padding:8px 10px;margin-bottom:7px;cursor:pointer;text-align:left}
.val-accrow:last-child{margin-bottom:0}
.val-accrow.on{border-color:#F0A9C0;background:#FFF7FA;box-shadow:var(--shadow-sm)}
.val-accrow .nm{font-size:12.5px;font-weight:900;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val-accrow .tg{font-size:10.5px;color:#B08A9A;font-weight:800}
.val-accrow .tr{font-size:11px;font-weight:900;white-space:nowrap;flex:0 0 auto}
.val-accrow .th{display:flex;gap:2px;flex:0 0 auto}
.val-accrow .th img{width:26px;height:16px;object-fit:contain;background:#FAF3EC;border-radius:5px}
.val-accrow .ct{font-size:11px;font-weight:900;color:#B85A76;white-space:nowrap;flex:0 0 auto}
.val-tier{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;border:1.5px solid #F3D2DE;padding:12px}
.val-tier-emo{font-size:30px;line-height:1;flex:0 0 auto}
.val-tier-main{flex:1 1 auto;min-width:0}
.val-tier-nm{font-size:19px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.val-tier-sub{font-size:11.5px;color:#A98A96;margin-top:1px;line-height:1.4}
.val-rr{height:9px;border-radius:999px;background:#F5E7EC;overflow:hidden;margin-top:7px}
.val-rr > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F5A8C0,#B98CE8)}
.val-skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.val-skin{background:#fff;border-radius:14px;border:1.5px solid #F0E4D3;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.val-skin img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#FBF6EE;border-radius:9px}
.val-skin .nm{font-size:10.5px;font-weight:800;line-height:1.25;color:#6B5544;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.val-skin .del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:7px;border:0;background:rgba(255,255,255,.92);color:#D96A5E;font-size:11px;cursor:pointer;display:grid;place-items:center}
.val-note{font-size:11.5px;color:#A08A96;line-height:1.5;background:#FFF7FA;border:1px solid #FBE3EC;border-radius:12px;padding:8px 10px;margin-top:8px}
.val-search{display:flex;gap:6px;margin-bottom:8px}
.val-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:46vh;overflow-y:auto;padding:1px}
.val-pick{background:#fff;border-radius:14px;border:1.5px solid #F0E4D3;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;text-align:left}
.val-pick img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#FBF6EE;border-radius:9px}
.val-pick .nm{font-size:10.5px;font-weight:800;line-height:1.25;color:#6B5544;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.val-empty{font-size:12px;color:#C0AF9C;padding:8px 2px;text-align:center;grid-column:1/-1}
.val-tier-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 2px;max-height:44vh;overflow-y:auto}
.val-tier-opt{border:1.5px solid #F0E4D3;background:#fff;border-radius:12px;padding:8px 4px;font-size:11.5px;font-weight:800;color:#8B7460;cursor:pointer;text-align:center;line-height:1.25}
.val-tier-opt.on{background:#FFE9F1;border-color:#F0A9C0;color:#A24663}

/* ---------- 발로란트 추억 사진첩 ---------- */
.alb-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.alb-chip{border:1.5px solid #F2DFC9;background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;color:#A9866A;cursor:pointer;white-space:nowrap;line-height:1.2}
.alb-chip b{font-weight:900;color:#C08A52;margin-left:2px}
.alb-chip.on{background:#FFF0DF;border-color:#F0C49B;color:#9C5F22}
.alb-chip.on b{color:#9C5F22}
.alb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.alb-card{background:#fff;border-radius:16px;border:1.5px solid #F3E6D5;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;min-width:0;box-shadow:var(--shadow-sm);font:inherit;color:inherit}
.alb-card:active{transform:scale(.99)}
.alb-thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;background:#FBF6EE;overflow:hidden}
.alb-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.alb-thumb .ph{width:100%;height:100%;display:grid;place-items:center;font-size:26px;background:linear-gradient(150deg,#FFF6E9,#FDEBDA)}
.alb-badge{position:absolute;right:6px;bottom:6px;background:rgba(38,26,18,.62);color:#fff;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800;line-height:1.25}
.alb-body{padding:7px 9px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.alb-who{align-self:flex-start;background:#FFF1E1;color:#9C5F22;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;line-height:1.4}
.alb-t{font-size:12px;font-weight:900;color:#6B5544;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.alb-m{font-size:10.5px;color:#A08A76;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.alb-d{font-size:10px;color:#C0AF9C;font-weight:800;line-height:1.45;word-break:keep-all}
.alb-empty{font-size:12px;color:#BFA98F;padding:16px 8px;text-align:center;border:1.5px dashed #F0E1CC;border-radius:14px;line-height:1.65;background:#FFFCF6}
.alb-pick{display:flex;gap:10px;align-items:center;margin:2px 0 10px}
.alb-prev{width:76px;height:76px;border-radius:12px;border:1.5px dashed #E9D8C2;background:#FCF8F1;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-size:22px}
.alb-prev img{width:100%;height:100%;object-fit:cover}
.alb-side{flex:1 1 auto;min-width:0}
.alb-side .btn{width:100%}
.alb-big{width:100%;max-height:56vh;object-fit:contain;border-radius:16px;display:block;background:#FBF6EE}
.alb-video{width:100%;max-height:52vh;border-radius:16px;display:block;background:#1B1410;margin-top:8px}
.alb-vbox{margin-top:8px}
.alb-vload{font-size:12px;color:#BFA98F;padding:18px 10px;text-align:center;border:1.5px dashed #F0E1CC;border-radius:14px;background:#FFFCF6;line-height:1.6}
.alb-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;display:block;background:#1B1410}
.alb-meta{font-size:11.5px;color:#A08874;font-weight:800;margin:0 0 8px}
.alb-tag{position:absolute;left:6px;top:6px;background:rgba(38,26,18,.6);color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800;line-height:1.3}
.alb-short{display:flex;align-items:center;gap:9px;width:100%;background:#fff;border:1.5px solid #F3E6D5;border-radius:14px;padding:7px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.alb-short:active{transform:scale(.99)}
.alb-short-th{width:54px;height:42px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:#FBF6EE;display:grid;place-items:center}
.alb-short-th img{width:100%;height:100%;object-fit:cover;display:block}
.alb-short-th .ph{font-size:18px}
.alb-short-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.alb-short-body .alb-t{-webkit-line-clamp:1}
.field--area{font-family:inherit;resize:vertical;min-height:62px;line-height:1.45}

.wx-outfit{display:flex;align-items:flex-start;gap:6px;background:#FFFDF3;border:1px solid #F6E9BF;border-radius:14px;padding:8px 10px;margin-top:9px;font-size:12.5px;font-weight:700;color:#8A6A2A;line-height:1.45}

.wx-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:9px}
.wx-day{background:rgba(255,255,255,.78);border-radius:11px;padding:5px 2px;text-align:center;min-width:0}
.wx-day.now{background:#fff;box-shadow:var(--shadow-sm)}
.wx-dow{font-size:9.5px;font-weight:900;color:#7E96AC;white-space:nowrap}
.wx-emo{font-size:15px;line-height:1.35}

.wx-rain{font-size:8.5px;font-weight:800;color:#5A8FB8;line-height:1.2;white-space:nowrap}

@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------------------------- 도구 ---------------------------- */
var WEEK_KO = ['일','월','화','수','목','금','토'];

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function parseYmd(s){
  if (typeof s !== 'string') return new Date();
  var p = s.split('-');
  if (p.length !== 3) return new Date();
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? new Date() : d;
}
function isValidYmd(s){
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseYmd(s).getTime());
}
function today(){ return ymd(new Date()); }
function dateKo(s){
  var d = parseYmd(s);
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + WEEK_KO[d.getDay()] + '요일';
}
function shortDateKo(s){
  var d = parseYmd(s);
  return (d.getMonth()+1) + '/' + d.getDate();
}
function startOfWeek(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var shift = (x.getDay() + 6) % 7; /* 월요일 시작 */
  x.setDate(x.getDate() - shift);
  return x;
}
function weekDates(d){
  var s = startOfWeek(d || new Date());
  var out = [];
  for (var i = 0; i < 7; i++){
    var x = new Date(s.getFullYear(), s.getMonth(), s.getDate() + i);
    out.push(x);
  }
  return out;
}
function dayDiff(fromYmd, toYmd){
  var a = parseYmd(fromYmd), b = parseYmd(toYmd);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function uid(){ return 'x' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function won(n){
  var v = Math.round(Number(n) || 0);
  return v.toLocaleString('ko-KR') + '원';
}
function comma(n){
  return Math.round(Number(n) || 0).toLocaleString('ko-KR');
}
function timeKo(ts){
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  var ap = h < 12 ? '오전' : '오후';
  var hh = h % 12; if (hh === 0) hh = 12;
  return ap + ' ' + hh + ':' + pad2(m);
}
function isObj(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function arrOf(v){ return Array.isArray(v) ? v : []; }
function numOf(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }
function strOf(v, d){ return (typeof v === 'string') ? v : d; }
function boolOf(v, d){ return (typeof v === 'boolean') ? v : d; }
function trimStr(v, max){
  return strOf(v, '').replace(/\s+/g, ' ').trim().slice(0, max || 40);
}

function stickerById(id){
  for (var i = 0; i < STICKERS.length; i++) if (STICKERS[i].id === id) return STICKERS[i];
  return STICKERS[0];
}
function stickerSVG(id){
  var s = stickerById(id);
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<circle cx="50" cy="50" r="47" fill="' + s.bg + '"/>' + s.inner + '</svg>';
}

/* ---------------------------- 저장/복원 ---------------------------- */
function normalize(raw){
  var s = defaultState();
  if (!isObj(raw)) return s;

  if (isObj(raw.family)){
    ALL.forEach(function(id){
      var f = raw.family[id];
      if (isObj(f)) s.family[id].stars = Math.max(0, Math.round(numOf(f.stars, 0)));
    });
  }

  if (isObj(raw.study)){
    ALL.forEach(function(id){
      if (!Array.isArray(raw.study[id])) return;
      s.study[id] = raw.study[id].filter(isObj).map(function(it){
        return {
          id: strOf(it.id, uid()),
          name: strOf(it.name, '공부').slice(0, 40),
          amount: Math.max(0, Math.round(numOf(it.amount, 0))),
          fixed: boolOf(it.fixed, true),
          date: isValidYmd(it.date) ? it.date : today()
        };
      });
    });
  }

  if (isObj(raw.done)){
    var doneOut = {};
    Object.keys(raw.done).forEach(function(dk){
      if (!isValidYmd(dk)) return;
      var day = raw.done[dk];
      if (!isObj(day)) return;
      var dst = {};
      ALL.forEach(function(id){
        if (!isObj(day[id])) return;
        var m = {};
        Object.keys(day[id]).forEach(function(k){
          var v = day[id][k];
          if (typeof v === 'number' && isFinite(v)) m[k] = Math.max(0, Math.round(v));
        });
        dst[id] = m;
      });
      doneOut[dk] = dst;
    });
    s.done = doneOut;
  }

  if (isObj(raw.stamps)){
    KIDS.forEach(function(id){
      s.stamps[id] = arrOf(raw.stamps[id]).filter(isValidYmd).sort();
    });
  }

  /* 받고 싶은 선물: 예전 상태에는 없으니 비어 있는 값으로 채워요 */
  if (isObj(raw.wishGifts)){
    ALL.forEach(function(id){
      s.wishGifts[id] = trimStr(raw.wishGifts[id], 40);
    });
  }

  /* 도장 목표 개수: 기본 30개, 1~200 사이만 받아요 */
  var goalRaw = Math.round(numOf(raw.stampGoal, 30));
  s.stampGoal = (goalRaw >= 1 && goalRaw <= 200) ? goalRaw : 30;

  /* 선물 달성 기록: 없으면 빈 목록 */
  if (Array.isArray(raw.giftHistory)){
    s.giftHistory = raw.giftHistory.filter(isObj).map(function(g){
      return {
        id: strOf(g.id, uid()),
        person: BY_ID[g.person] ? g.person : '',
        gift: trimStr(g.gift, 40),
        date: isValidYmd(g.date) ? g.date : today(),
        n: Math.max(0, Math.round(numOf(g.n, 0))),
        by: BY_ID[g.by] ? g.by : '',
        at: strOf(g.at, new Date().toISOString())
      };
    }).filter(function(g){ return g.person; });
  }

  if (isObj(raw.todos)){
    ALL.forEach(function(id){
      if (!Array.isArray(raw.todos[id])) return;
      s.todos[id] = raw.todos[id].filter(isObj).map(function(td){
        return {
          id: strOf(td.id, uid()),
          text: strOf(td.text, '할 일').slice(0, 60),
          doneOn: isValidYmd(td.doneOn) ? td.doneOn : null
        };
      });
    });
  }

  if (isObj(raw.mission)){
    s.mission = {
      date: isValidYmd(raw.mission.date) ? raw.mission.date : today(),
      id: strOf(raw.mission.id, 'm01'),
      done: boolOf(raw.mission.done, false),
      total: Math.max(0, Math.round(numOf(raw.mission.total, 0)))
    };
    if (!MISSIONS.some(function(m){ return m.id === s.mission.id; })) s.mission.id = 'm01';
  }

  if (isObj(raw.meals)){
    var mealsOut = {};
    Object.keys(raw.meals).forEach(function(dk){
      if (!isValidYmd(dk) || !isObj(raw.meals[dk])) return;
      var src = raw.meals[dk], dst = {};
      MEAL_SLOTS.forEach(function(slot){ dst[slot.k] = strOf(src[slot.k], '').slice(0, 80); });
      mealsOut[dk] = dst;
    });
    s.meals = mealsOut;
  }

  if (Array.isArray(raw.events)){
    s.events = raw.events.filter(isObj).map(function(ev){
      return {
        id: strOf(ev.id, uid()),
        date: isValidYmd(ev.date) ? ev.date : today(),
        title: strOf(ev.title, '').slice(0, 80),
        done: boolOf(ev.done, false),
        time: /^\d{2}:\d{2}$/.test(strOf(ev.time, '')) ? ev.time : '',
        who: BY_ID[ev.who] ? ev.who : ''
      };
    }).filter(function(ev){ return ev.title; });
  }

  if (isObj(raw.health)){
    var healthOut = {};
    Object.keys(raw.health).forEach(function(dk){
      if (!isValidYmd(dk) || !isObj(raw.health[dk])) return;
      var src = raw.health[dk], dst = {};
      ALL.forEach(function(id){
        if (!Array.isArray(src[id])) return;
        var allowed = HEALTH_ITEMS[id].map(function(i){ return i.k; });
        dst[id] = src[id].filter(function(k){ return allowed.indexOf(k) >= 0; });
      });
      healthOut[dk] = dst;
    });
    s.health = healthOut;
  }

  if (Array.isArray(raw.praise)){
    s.praise = raw.praise.filter(isObj).map(function(pr){
      return {
        id: strOf(pr.id, uid()),
        from: BY_ID[pr.from] ? pr.from : 'mom',
        to: BY_ID[pr.to] ? pr.to : 'dad',
        text: strOf(pr.text, '').slice(0, 200),
        star: boolOf(pr.star, false),
        at: strOf(pr.at, new Date().toISOString())
      };
    }).filter(function(pr){ return pr.text; });
  }

  if (isObj(raw.allowance)){
    KIDS.forEach(function(id){
      var src = raw.allowance[id];
      if (!isObj(src)) return;
      s.allowance[id].start = Math.max(0, Math.round(numOf(src.start, 0)));
      s.allowance[id].ledger = arrOf(src.ledger).filter(isObj).map(function(e){
        return {
          id: strOf(e.id, uid()),
          kind: e.kind === 'out' ? 'out' : 'in',
          amount: Math.max(0, Math.round(numOf(e.amount, 0))),
          memo: strOf(e.memo, '').slice(0, 40),
          date: isValidYmd(e.date) ? e.date : today()
        };
      }).filter(function(e){ return e.amount > 0; });
    });
  }

  if (isObj(raw.chat)){
    s.chat.sender = BY_ID[raw.chat.sender] ? raw.chat.sender : 'mom';
    s.chat.locked = boolOf(raw.chat.locked, false);
    if (Array.isArray(raw.chat.messages)){
      s.chat.messages = raw.chat.messages.filter(isObj).map(function(m){
        var kind = m.kind === 'sticker' ? 'sticker' : 'text';
        return {
          id: strOf(m.id, uid()),
          sender: BY_ID[m.sender] ? m.sender : 'mom',
          kind: kind,
          text: kind === 'text' ? strOf(m.text, '').slice(0, 500) : '',
          sticker: kind === 'sticker' ? stickerById(strOf(m.sticker, 'heart')).id : '',
          at: numOf(m.at, Date.now()),
          heart: boolOf(m.heart, false)
        };
      }).filter(function(m){ return m.kind === 'sticker' || m.text; });
    }
  }

  /* 학원 숙제: 과목별 목록 (없으면 빈 목록) */
  if (isObj(raw.homework)){
    KIDS.forEach(function(id){
      var src = isObj(raw.homework[id]) ? raw.homework[id] : {};
      HOMEWORK_SUBJECTS.forEach(function(sub){
        var list = Array.isArray(src[sub.k]) ? src[sub.k] : [];
        s.homework[id][sub.k] = list.filter(isObj).map(function(it){
          return {
            id: strOf(it.id, uid()),
            text: strOf(it.text, '').slice(0, 60),
            due: isValidYmd(it.due) ? it.due : '',
            doneOn: isValidYmd(it.doneOn) ? it.doneOn : null,
            at: numOf(it.at, Date.now())
          };
        }).filter(function(it){ return it.text; });
      });
    });
  }

  /* 학교 급식 학교 정보(NEIS 코드) */
  if (isObj(raw.schools)){
    KIDS.forEach(function(id){
      var src = raw.schools[id];
      if (!isObj(src)) return;
      var atpt = String(strOf(src.atpt, '')).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
      var code = String(strOf(src.code, '')).replace(/[^0-9]/g, '').slice(0, 8);
      var nm = trimStr(src.name, 30);
      if (atpt && code) s.schools[id] = { atpt: atpt, code: code, name: nm || s.schools[id].name };
    });
  }

  /* 성장 기록 */
  if (isObj(raw.growth)){
    KIDS.forEach(function(id){
      if (!Array.isArray(raw.growth[id])) return;
      s.growth[id] = raw.growth[id].filter(isObj).map(function(g){
        return {
          id: strOf(g.id, uid()),
          date: isValidYmd(g.date) ? g.date : today(),
          height: Math.max(0, Math.round(numOf(g.height, 0) * 10) / 10),
          weight: Math.max(0, Math.round(numOf(g.weight, 0) * 10) / 10),
          memo: trimStr(g.memo, 60),
          at: numOf(g.at, Date.now())
        };
      }).filter(function(g){ return g.height > 0 || g.weight > 0; })
        .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    });
  }

  /* 생년월(성장 백분위 계산용) */
  if (isObj(raw.births)){
    KIDS.forEach(function(id){
      var b = strOf(raw.births[id], '');
      s.births[id] = /^\d{4}-\d{2}(-\d{2})?$/.test(b) ? b : '';
    });
  }

  /* 발로란트: 계정 · 티어 · 보유 스킨 */
  if (isObj(raw.valorant)){
    var va = raw.valorant;
    var accs = [];
    arrOf(va.accounts).forEach(function(a){
      if (!isObj(a)) return;
      var nm = trimStr(a.name, 24).replace(/^#+/, '');
      var tg = trimStr(a.tag, 8).replace(/^#+/, '');
      if (!nm) return;
      var rg = trimStr(a.region, 6).toLowerCase();
      accs.push({
        id: strOf(a.id, uid()),
        name: nm, tag: tg,
        region: /^(kr|ap|eu|na|br|latam)$/.test(rg) ? rg : 'kr',
        label: trimStr(a.label, 12)
      });
    });
    if (accs.length) s.valorant.accounts = accs.slice(0, 8);
    var cur = strOf(va.cur, '');
    s.valorant.cur = s.valorant.accounts.some(function(a){ return a.id === cur; }) ? cur : s.valorant.accounts[0].id;
    if (isObj(va.tiers)){
      var tiers = {};
      Object.keys(va.tiers).forEach(function(k){
        var t = va.tiers[k];
        if (!isObj(t)) return;
        tiers[k] = {
          tier: Math.max(0, Math.min(VAL_TIERS.length - 1, Math.round(numOf(t.tier, 0)))),
          rr: Math.max(0, Math.min(100, Math.round(numOf(t.rr, 0)))),
          at: trimStr(t.at, 10),
          by: trimStr(t.by, 12)
        };
      });
      s.valorant.tiers = tiers;
    }
    /* 보유 스킨: 계정별 보관함. 예전 공용 배열이면 기본(첫) 계정으로 옮겨요 */
    var readSkinList = function(list){
      var seen = {};
      return arrOf(list).filter(isObj).map(function(k){
        return {
          id: trimStr(k.id, 60),
          name: trimStr(k.name, 60),
          icon: trimStr(k.icon, 300),

        };
      }).filter(function(k){

    var skinMap = {};

    if (Array.isArray(va.album)) s.valorant.album = albReadList(va.album);

  if (isObj(raw.ui)){

    s.ui.albumWho = BY_ID[raw.ui.albumWho] ? raw.ui.albumWho : '';
  }

}

/* ---------------------------- 계산 ---------------------------- */
function missionById(id){
  for (var i = 0; i < MISSIONS.length; i++) if (MISSIONS[i].id === id) return MISSIONS[i];
  return MISSIONS[0];
}
function currentMission(){
  if (!state.mission || state.mission.date !== today()){
    var prev = state.mission || {};
    state.mission = {
      date: today(),
      id: missionById(prev.id).id,
      done: false,
      total: Math.max(0, numOf(prev.total, 0))
    };
  }
  return missionById(state.mission.id);
}

function studyItems(kid, date){
  var d = date || today();
  return state.study[kid].filter(function(it){ return it.fixed || it.date === d; });
}
function doneMap(kid, date){
  var d = date || today();
  return (state.done[d] && state.done[d][kid]) || {};
}
function isStudyDone(kid, itemId, date){
  return Object.prototype.hasOwnProperty.call(doneMap(kid, date), itemId);
}
function studyEarned(kid){
  var total = 0;
  Object.keys(state.done).forEach(function(d){
    var m = state.done[d][kid];
    if (!m) return;
    Object.keys(m).forEach(function(k){ total += Math.max(0, numOf(m[k], 0)); });
  });
  return total;
}
function studyEarnedOn(kid, date){
  var m = doneMap(kid, date);
  var total = 0;
  Object.keys(m).forEach(function(k){ total += Math.max(0, numOf(m[k], 0)); });
  return total;
}
function ledgerTotals(kid){
  var din = 0, dout = 0;
  state.allowance[kid].ledger.forEach(function(e){
    if (e.kind === 'in') din += e.amount; else dout += e.amount;
  });
  return { din:din, dout:dout };
}
function balance(kid){
  var t = ledgerTotals(kid);
  return state.allowance[kid].start + studyEarned(kid) + t.din - t.dout;
}
function addStamp(kid, date){
  var d = date || today();
  if (state.stamps[kid].indexOf(d) < 0){
    state.stamps[kid].push(d);
    state.stamps[kid].sort();
  }
}
function stampStreak(kid){
  var set = {};
  state.stamps[kid].forEach(function(d){ set[d] = true; });
  var cur = new Date();
  if (!set[ymd(cur)]) cur.setDate(cur.getDate() - 1);
  var n = 0;
  while (set[ymd(cur)] && n < 400){
    n++;
    cur.setDate(cur.getDate() - 1);
  }
  return n;
}
function monthStampCount(kid, ref){
  var d = ref || new Date();
  var prefix = d.getFullYear() + '-' + pad2(d.getMonth()+1);
  return state.stamps[kid].filter(function(s){ return s.indexOf(prefix) === 0; }).length;
}
function todayStamped(kid){
  return state.stamps[kid].indexOf(today()) >= 0;
}

var toastTimer = null;

var modalCleanup = null;
function openModal(html, onMount){
  var root = document.getElementById('modalRoot');

  root.innerHTML = '<div class="overlay" data-overlay="1"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  var overlay = root.querySelector('[data-overlay]');
  overlay.addEventListener('click', function(e){

  });
  var btn = root.querySelector('[data-act="modal-close"]');
  if (btn) btn.addEventListener('click', closeModal);
  document.body.style.overflow = 'hidden';

  var root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';

}

var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=36.8151&longitude=127.1139' +
  '&current=temperature_2m,apparent_temperature,weather_code,precipitation' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max' +
  '&timezone=Asia%2FSeoul&forecast_days=7';
var weather = { status:'idle', data:null, at:null, stale:false };
var weatherLoading = false;

function weatherInfo(code){
  var table = {
    0:['☀️','맑음'], 1:['🌤️','대체로 맑음'], 2:['⛅','구름 조금'], 3:['☁️','흐림'],
    45:['🌫️','안개'], 48:['🌫️','안개'],
    51:['🌦️','약한 이슬비'], 53:['🌦️','이슬비'], 55:['🌧️','짙은 이슬비'],
    56:['🌧️','어는 이슬비'], 57:['🌧️','어는 이슬비'],
    61:['🌦️','약한 비'], 63:['🌧️','비'], 65:['🌧️','강한 비'],
    66:['🌧️','어는 비'], 67:['🌧️','어는 비'],
    71:['🌨️','약한 눈'], 73:['🌨️','눈'], 75:['❄️','많은 눈'], 77:['❄️','싸락눈'],
    80:['🌦️','약한 소나기'], 81:['🌧️','소나기'], 82:['⛈️','강한 소나기'],
    85:['🌨️','소낙눈'], 86:['❄️','강한 소낙눈'],
    95:['⛈️','뇌우'], 96:['⛈️','우박 섞인 뇌우'], 99:['⛈️','강한 뇌우']
  };
  return table[code] || ['🌡️','날씨'];
}

function readWeatherCache(){
  try {
    var raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    if (!isObj(obj) || !isObj(obj.data) || typeof obj.data.temp !== 'number') return null;
    return obj;
  } catch (e){ return null; }
}

function loadWeather(){
  if (weatherLoading) return;
  if (!weather.data){
    var cache = readWeatherCache();
    if (cache){
      weather = { status:'ok', data:cache.data, at:cache.at, stale:true };
      paintWeather();
    }
  }
  var fetchFn = null;
  try { fetchFn = window.fetch || (typeof fetch === 'function' ? fetch : null); } catch (e){ fetchFn = null; }
  if (!fetchFn){
    if (!weather.data){ weather = { status:'error', data:null, at:null, stale:false }; }
    paintWeather();
    return;
  }
  weatherLoading = true;
  if (!weather.data) weather.status = 'loading';
  paintWeather();

  var timerId = null, ctrl = null;
  try {
    ctrl = new AbortController();
    timerId = setTimeout(function(){ try { ctrl.abort(); } catch (e){} }, 9000);
  } catch (e){ ctrl = null; }

  var opts = { cache:'no-store' };
  if (ctrl) opts.signal = ctrl.signal;

  fetchFn(WEATHER_URL, opts)
    .then(function(res){
      if (!res || !res.ok) throw new Error('HTTP ' + (res ? res.status : '?'));
      return res.json();
    })
    .then(function(json){
      var cur = json && json.current, daily = json && json.daily;
      if (!cur || !daily || !Array.isArray(daily.temperature_2m_max)) throw new Error('bad payload');
      var days = [], times = Array.isArray(daily.time) ? daily.time : [];
      for (var i = 0; i < times.length && i < 7; i++){
        days.push({
          date: strOf(times[i], ''),
          code: Math.round(numOf(daily.weather_code && daily.weather_code[i], 0)),
          min: Math.round(numOf(daily.temperature_2m_min && daily.temperature_2m_min[i], 0)),
          max: Math.round(numOf(daily.temperature_2m_max && daily.temperature_2m_max[i], 0)),
          rain: Math.round(numOf(daily.precipitation_probability_max && daily.precipitation_probability_max[i], 0))
        });
      }
      var todayRow = days[0] || {};
      var data = {
        temp: Math.round(numOf(cur.temperature_2m, 0)),
        feels: Math.round(numOf(cur.apparent_temperature, numOf(cur.temperature_2m, 0))),
        code: Math.round(numOf(cur.weather_code, 0)),
        min: numOf(todayRow.min, Math.round(numOf(daily.temperature_2m_min && daily.temperature_2m_min[0], 0))),
        max: numOf(todayRow.max, Math.round(numOf(daily.temperature_2m_max[0], 0))),
        rain: numOf(todayRow.rain, 0),
        days: days,
        observed: strOf(cur.time, '')
      };
      weather = { status:'ok', data:data, at:new Date().toISOString(), stale:false };
      try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ at: weather.at, data: data })); } catch (e){}
    })
    .catch(function(){
      if (weather.data){ weather.stale = true; }
      else { weather = { status:'error', data:null, at:null, stale:false }; }
    })
    .then(function(){
      weatherLoading = false;
      if (timerId) clearTimeout(timerId);
      if (typeof document === 'undefined' || !document.getElementById) return;
      paintWeather();
    });
}

/* 오늘 기온·일교차·비 소식으로 옷차림 한 줄을 만들어요 */
function outfitAdvice(d){
  if (!isObj(d)) return '';
  var t = numOf(d.feels, numOf(d.temp, 0));
  var diff = Math.max(0, numOf(d.max, 0) - numOf(d.min, 0));
  var rain = numOf(d.rain, 0);
  var wear;
  if (t >= 28) wear = '반팔·반바지처럼 시원하게';
  else if (t >= 23) wear = '반팔에 얇은 겉옷 한 장';
  else if (t >= 20) wear = '긴팔 티나 얇은 가디건';
  else if (t >= 17) wear = '맨투맨이나 얇은 재킷';
  else if (t >= 12) wear = '니트에 자켓';
  else if (t >= 5) wear = '코트나 두꺼운 겉옷';
  else if (t >= -4) wear = '패딩에 목도리까지';
  else wear = '두꺼운 패딩·장갑·목도리';
  var extra = [];
  if (diff >= 10) extra.push('아침저녁 ' + diff + '° 차이라 겉옷 챙기기');
  if (rain >= 60) extra.push('비 소식이 있어요, 우산 꼭 챙기세요');
  else if (rain >= 30) extra.push('비가 올 수 있어요, 작은 우산이 좋아요');
  return wear + (extra.length ? ' · ' + extra.join(' · ') : '');
}

var calView = { kid:'taeju', y:0, m:0 };

function openStampCal(kid){
  var d = new Date();
  calView = { kid:kid, y:d.getFullYear(), m:d.getMonth() };
  paintStampCal();
}

function paintStampCal(){
  var kid = calView.kid;
  var p = person(kid);
  var first = new Date(calView.y, calView.m, 1);
  var days = new Date(calView.y, calView.m + 1, 0).getDate();
  var lead = first.getDay();
  var set = {};
  state.stamps[kid].forEach(function(s){ set[s] = true; });
  var cells = [];
  for (var i = 0; i < lead; i++) cells.push('<div class="cal-cell blank"></div>');
  for (var day = 1; day <= days; day++){
    var key = calView.y + '-' + pad2(calView.m + 1) + '-' + pad2(day);
    var on = !!set[key];
    var isToday = key === today();
    cells.push('<div class="cal-cell' + (on ? ' on' : '') + (isToday ? ' today' : '') + '" aria-label="' + day + '일' + (on ? ' 도장' : '') + '">' +
      (on
        ? '<span style="position:absolute;top:1px;left:3px;font-size:8.5px;opacity:.55">' + day + '</span>' + avatarSVG(p.kind, 27)
        : '<span>' + day + '</span>') +
    '</div>');
  }

  var html = '' +
    '<div class="sheet-hd">' +
      '<div class="sheet-title">📅 ' + esc(p.name) + ' 도장판 달력</div>' +
      '<button class="sheet-close" data-act="modal-close" aria-label="닫기">✕</button>' +
    '</div>' +
    '<div class="card-desc">공부나 루틴을 하나라도 마친 날에 도장이 찍혀요.</div>' +
    '<div class="cal-head">' +
      '<button class="cal-nav" data-act="cal-nav" data-id="-1" aria-label="이전 달">‹</button>' +
      '<div class="cal-month">' + calView.y + '년 ' + (calView.m + 1) + '월</div>' +
      '<button class="cal-nav" data-act="cal-nav" data-id="1" aria-label="다음 달">›</button>' +
    '</div>' +
    '<div class="cal">' +
      ['일','월','화','수','목','금','토'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('') +
      cells.join('') +
    '</div>' +
    '<div class="cal-legend">' +
      '<span><span class="legend-dot" style="background:#FFF4CF;box-shadow:inset 0 0 0 1px #F3D98E"></span>도장 찍은 날</span>' +
      '<span>이번 달 ' + monthStampCount(kid, new Date(calView.y, calView.m, 1)) + '개</span>' +
      '<span>🔥 연속 ' + stampStreak(kid) + '일</span>' +
    '</div>';

  openModal(html);
}

/* ---------------------------- 타이머 ---------------------------- */
var timer = { mode:'down', minutes:10, secs:600, running:false, finished:false, endAt:0, startedAt:0, iv:null };

function fmtSecs(s){
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), sec = s % 60;
  if (m > 99) m = 99;
  return pad2(m) + ':' + pad2(sec);
}

function timerSubText(){
  if (timer.mode === 'down'){
    if (timer.running) return '집중하는 중이에요 · ' + timer.minutes + '분';
    if (timer.finished) return '시간 다 됐어요! 🎉';
    return timer.minutes + '분 · 시작을 눌러요';
  }
  if (timer.running) return '시간을 재는 중이에요';
  if (timer.secs > 0) return '잰 시간 ' + fmtSecs(timer.secs);
  return '시작을 누르면 시간이 재져요';
}

function timerCardHTML(){
  var presets = [10,20,30].map(function(m){
    return '<button class="preset' + (timer.minutes === m && timer.mode === 'down' ? ' on' : '') + '" data-act="timer-preset" data-id="' + m + '">' + m + '분</button>';
  }).join('');

  return '<div class="card card--sky">' +
    '<div class="card-title">⏳ 공부 타이머</div>' +
    '<div class="card-desc" style="margin:4px 0 8px">' +
      (timer.mode === 'down' ? '정한 시간이 지나면 알려드려요' : '공부한 시간을 그대로 재요') +
    '</div>' +
    '<div class="timer-modes">' +
      '<button class="' + (timer.mode === 'down' ? 'on' : '') + '" data-act="timer-mode" data-id="down">⌛ 남은 시간</button>' +
      '<button class="' + (timer.mode === 'up' ? 'on' : '') + '" data-act="timer-mode" data-id="up">⏱ 재는 시간</button>' +
    '</div>' +
    '<div class="timer-sub" id="timerSub">' + timerSubText() + '</div>' +
    '<div class="timer-time' + (timer.finished ? ' done' : '') + '" id="timerTime">' + fmtSecs(timer.secs) + '</div>' +
    '<div class="timer-btns">' +
      '<button class="btn btn--mint" id="timerToggle" data-act="timer-toggle">' + (timer.running ? '⏸ 일시정지' : '▶ 시작') + '</button>' +
      '<button class="btn" data-act="timer-reset">↺ 초기화</button>' +
    '</div>' +
    (timer.mode === 'down' ?
      '<div class="presets">' + presets + '</div>' +
      '<div class="timer-custom">' +
        '<input class="field field--sm" id="timerCustom" inputmode="numeric" placeholder="직접 (분)" value="' + (timer.minutes > 0 ? timer.minutes : '') + '">' +
        '<button class="btn btn--sm btn--sky" data-act="timer-custom">분 맞추기</button>' +
      '</div>' : '') +
  '</div>';
}

function updateTimerText(){
  var t = document.getElementById('timerTime');
  if (t){
    t.textContent = fmtSecs(timer.secs);
    if (timer.finished) t.classList.add('done'); else t.classList.remove('done');
  }
  var sub = document.getElementById('timerSub');
  if (sub) sub.textContent = timerSubText();
}

function paintTimerButtons(){
  var b = document.getElementById('timerToggle');
  if (b) b.textContent = timer.running ? '⏸ 일시정지' : '▶ 시작';
}

function paintTimer(){
  updateTimerText();
  paintTimerButtons();
  if (timer.running && !timer.iv) timer.iv = setInterval(timerTick, 250);
}

function timerTick(){
  if (!timer.running) return;
  var now = Date.now();
  if (timer.mode === 'down'){
    var left = Math.ceil((timer.endAt - now) / 1000);
    timer.secs = Math.max(0, left);
    if (left <= 0){
      timer.secs = 0;
      timer.running = false;
      timer.finished = true;
      if (timer.iv){ clearInterval(timer.iv); timer.iv = null; }
      beep();
      toast('시간 다 됐어요! 정말 잘했어요 🎉');
    }
  } else {
    timer.secs = Math.max(0, Math.floor((now - timer.startedAt) / 1000));
  }
  updateTimerText();
  paintTimerButtons();
}

function timerToggle(){
  if (timer.running){ timerPause(); return; }
  timer.finished = false;
  if (timer.mode === 'down'){
    if (timer.secs <= 0) timer.secs = Math.max(1, timer.minutes * 60);
    timer.endAt = Date.now() + timer.secs * 1000;
  } else {
    timer.startedAt = Date.now() - timer.secs * 1000;
  }
  timer.running = true;
  if (timer.iv) clearInterval(timer.iv);
  timer.iv = setInterval(timerTick, 250);
  updateTimerText();
  paintTimerButtons();
}

function timerPause(){
  if (!timer.running) return;
  timerTick();
  timer.running = false;
  if (timer.iv){ clearInterval(timer.iv); timer.iv = null; }
  updateTimerText();
  paintTimerButtons();
}

function timerReset(){
  timer.running = false;
  timer.finished = false;
  if (timer.iv){ clearInterval(timer.iv); timer.iv = null; }
  timer.secs = timer.mode === 'down' ? timer.minutes * 60 : 0;
  updateTimerText();
  paintTimerButtons();
}

function timerSetMode(mode){
  timer.mode = mode === 'up' ? 'up' : 'down';
  timer.running = false;
  timer.finished = false;
  if (timer.iv){ clearInterval(timer.iv); timer.iv = null; }
  timer.secs = timer.mode === 'down' ? timer.minutes * 60 : 0;
}

function timerSetMinutes(min){
  min = Math.max(1, Math.min(180, Math.round(Number(min) || 0) || 1));
  timer.minutes = min;
  timer.running = false;
  timer.finished = false;
  if (timer.iv){ clearInterval(timer.iv); timer.iv = null; }
  timer.secs = min * 60;
}

function beep(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.07;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.4);
    setTimeout(function(){ try { ctx.close(); } catch (e){} }, 800);
  } catch (e){}
}

function exportJSON(){
  var data = JSON.stringify(state, null, 2);
  var name = '우리_가족_기록장_백업_' + today() + '.json';
  var done = false;
  try {
    if (typeof Blob === 'function' && typeof URL !== 'undefined' && URL.createObjectURL){
      var blob = new Blob([data], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ try { a.remove(); } catch (e){} }, 400);
      setTimeout(function(){ try { URL.revokeObjectURL(url); } catch (e){} }, 3000);
      done = true;
    }
  } catch (e){ done = false; }

  if (done){ toast('백업 파일을 내려받았어요'); return; }
  openModal(
    '<div class="sheet-hd"><div class="sheet-title">📄 백업 내용</div>' +
    '<button class="sheet-close" data-act="modal-close" aria-label="닫기">✕</button></div>' +
    '<div class="card-desc">이 환경에서는 파일로 저장할 수 없어요. 아래 내용을 복사해 두세요.</div>' +
    '<textarea class="field" style="height:240px;font-size:11px" readonly>' + esc(data) + '</textarea>'
  );
}

function handleImportFile(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var obj = null;
    try { obj = JSON.parse(String(reader.result)); } catch (e){ obj = null; }
    if (!isObj(obj)){ toast('백업 파일을 읽을 수 없어요'); return; }
    var next = normalize(obj);
    var summary = '가족 ' + ALL.length + '명 · 공부 ' +
      ((next.study.taeju || []).length + (next.study.juwon || []).length) + '개 · 채팅 ' +
      next.chat.messages.length + '개';
    confirmModal('백업을 불러올까요?', '지금 기록이 백업 파일 내용으로 바뀌고, <b>가족 모두의 화면에도 함께 반영돼요</b>.<br><span class="tiny">' + summary + '</span>', '불러오기', function(){
      state = next;
      save();
      render();
      toast('백업을 불러왔어요');
    });
  };
  reader.onerror = function(){ toast('파일을 읽지 못했어요'); };
  reader.readAsText(file);
}

/* ---------------------------- 이벤트 연결 ---------------------------- */
document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.closest) return;
  var el = t.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var fn = ACTIONS[act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  try {
    fn(el, e);
  } catch (err){
    if (window.console && console.error) console.error(err);
    toast('문제가 생겼어요. 다시 시도해 주세요.');
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el || !el.matches) return;
  if (el.matches('[data-meal]')){
    var d = today();
    if (!state.meals[d]) state.meals[d] = {};
    state.meals[d][el.getAttribute('data-meal')] = String(el.value || '').slice(0, 80);
    save();
    return;
  }
  if (el.id === 'praiseFrom'){ state.ui.praiseFrom = el.value; save(); return; }
  if (el.id === 'praiseTo'){ state.ui.praiseTo = el.value; save(); return; }
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var ent = el.getAttribute('data-enter');
  if (!ent) return;
  e.preventDefault();
  if (ent === 'todo-add'){ if (addTodo(el.getAttribute('data-person'), el.value)) render(); return; }
  if (ent === 'todo-save'){ if (saveTodoEdit(el.getAttribute('data-person'), el.getAttribute('data-id'), el.value)) render(); return; }
  if (ent === 'event-add'){ if (addEvent()) render(); return; }
  if (ent === 'hw-save'){ saveHwModal(el.getAttribute('data-person'), el.getAttribute('data-id')); return; }
  if (ent === 'val-skin-search'){ doSkinSearch(); return; }
  if (ent === 'chat-send'){ if (sendChat()) render(); return; }
  if (ent === 'wish-save'){ saveWish(el.getAttribute('data-person')); return; }
});

function hwList(kid, sub){
  if (!state.homework[kid]) state.homework[kid] = {};
  if (!Array.isArray(state.homework[kid][sub])) state.homework[kid][sub] = [];
  return state.homework[kid][sub];
}
function hwCounts(kid){
  var out = { total:0, done:0, bySubject:{} };
  HOMEWORK_SUBJECTS.forEach(function(sub){
    var list = (state.homework[kid] && state.homework[kid][sub.k]) || [];
    var done = list.filter(function(it){ return !!it.doneOn; }).length;
    out.bySubject[sub.k] = { total:list.length, done:done };
    out.total += list.length;
    out.done += done;
  });
  return out;
}
function hwRowHTML(kid, sub, it){
  var done = !!it.doneOn;
  var due = '';
  if (it.due && !done){
    var diff = dayDiff(today(), it.due);
    var label = diff === 0 ? '오늘까지' : diff > 0 ? 'D-' + diff : '지남';
    var cls = diff === 0 ? ' today' : diff < 0 ? ' past' : '';
    due = '<span class="hw-due' + cls + '">' + esc(label) + '</span>';
  }
  return '<div class="hw-row">' +
    '<button class="chk chk--blue' + (done ? ' on' : '') + '" data-act="hw-toggle" data-person="' + kid + '" data-sub="' + sub.k + '" data-id="' + it.id + '" aria-label="' + (done ? '완료 취소' : '숙제 완료') + '">' + (done ? '✓' : '') + '</button>' +
    '<div class="hw-text' + (done ? ' done' : '') + '">' + esc(it.text) + '</div>' +
    due +
    '<button class="iconbtn" data-act="hw-edit" data-person="' + kid + '" data-sub="' + sub.k + '" data-id="' + it.id + '" aria-label="수정">✏️</button>' +
    '<button class="iconbtn iconbtn--del" data-act="hw-del" data-person="' + kid + '" data-sub="' + sub.k + '" data-id="' + it.id + '" aria-label="삭제">✕</button>' +
  '</div>';
}
function homeworkCardHTML(){
  var kid = state.ui.kid, p = person(kid);
  var c = hwCounts(kid);
  var blocks = HOMEWORK_SUBJECTS.map(function(sub){
