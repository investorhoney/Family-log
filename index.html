/* ============================ 학교 급식 (나이스 NEIS) ============================ */
var LUNCH_CACHE_KEY = 'uri-family-record:lunch:v1';
var LUNCH_TTL = 3 * 60 * 60 * 1000;
var lunch = { status:{ taeju:'idle', juwon:'idle' }, data:{}, at:{}, loading:false };

function schoolOf(kid){
  var s = state.schools && state.schools[kid];
  if (isObj(s) && s.atpt && s.code) return s;
  return SCHOOL_DEFAULT[kid] || SCHOOL_DEFAULT.taeju;
}
function readLunchCache(){
  try {
    var o = JSON.parse(localStorage.getItem(LUNCH_CACHE_KEY) || 'null');
    return isObj(o) ? o : {};
  } catch (e){ return {}; }
}
function writeLunchCache(obj){
  try { localStorage.setItem(LUNCH_CACHE_KEY, JSON.stringify(obj)); } catch (e){}
}
function lunchDates(){
  if (state.ui.lunchView === 'week'){
    var d = new Date(), dow = d.getDay();
    var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((dow + 6) % 7));
    var out = [];
    for (var i = 0; i < 5; i++) out.push(ymd(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i)));
    return out;
  }
  return [today()];
}
function lunchRange(){
  var ds = lunchDates();
  return { from: ds[0].replace(/-/g, ''), to: ds[ds.length - 1].replace(/-/g, ''), dates: ds };
}
function neisMeals(json){
  if (!isObj(json)) return { code:'ERROR', rows:[] };
  if (isObj(json.RESULT)) return { code: strOf(json.RESULT.CODE, 'ERROR'), rows:[] };
  var body = json.mealServiceDietInfo;
  if (!Array.isArray(body)) return { code:'ERROR', rows:[] };
  var code = 'INFO-000';
  var head = (body[0] && body[0].head) || [];
  head.forEach(function(h){ if (isObj(h) && isObj(h.RESULT)) code = strOf(h.RESULT.CODE, code); });
  var rows = (body[1] && Array.isArray(body[1].row)) ? body[1].row : [];
  var only = rows.filter(function(r){ return String(r.MMEAL_SC_CODE) === '2'; });
  if (only.length) rows = only;
  var seen = {};
  return { code: code, rows: rows.filter(function(r){
    var k = strOf(r.MLSV_YMD, '');
    if (!k || seen[k]) return false;
    seen[k] = 1;
    return true;
  }) };
}
function parseMealRow(r){
  var parts = String(r.DDISH_NM || '').split(/<br\s*\/?>/i);
  var allergy = {};
  var dishes = [];
  parts.forEach(function(s){
    s = String(s).trim();
    if (!s) return;
    var m = s.match(/\(([0-9.\s]+)\)\s*$/);
    if (m){
      m[1].split('.').forEach(function(n){ n = n.trim(); if (n) allergy[n] = 1; });
      s = s.replace(/\(([0-9.\s]+)\)\s*$/, '').trim();
    }
    s = s.replace(/\*+$/, '').replace(/\s+/g, ' ').trim();
    if (s) dishes.push(s);
  });
  var kcal = (String(r.CAL_INFO || '').match(/[0-9]+(\.[0-9]+)?/) || [''])[0];
  return {
    date: strOf(r.MLSV_YMD, ''),
    dishes: dishes,
    kcal: kcal,
    allergy: Object.keys(allergy).sort(function(a, b){ return Number(a) - Number(b); })
  };
}
function fetchLunch(school, range){
  var fetchFn = null;
  try { fetchFn = window.fetch || null; } catch (e){ fetchFn = null; }
  if (!fetchFn) return Promise.reject(new Error('no fetch'));
  var url = 'https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=100' +
    '&ATPT_OFCDC_SC_CODE=' + encodeURIComponent(school.atpt) +
    '&SD_SCHUL_CODE=' + encodeURIComponent(school.code) +
    '&MLSV_FROM_YMD=' + range.from + '&MLSV_TO_YMD=' + range.to;
  var ctrl = null, timer = null, opts = { cache:'no-store' };
  try {
    ctrl = new AbortController();
    opts.signal = ctrl.signal;
    timer = setTimeout(function(){ try { ctrl.abort(); } catch (e){} }, 12000);
  } catch (e){ ctrl = null; }
  var done = function(){ if (timer) clearTimeout(timer); };
  return fetchFn(url, opts)
    .then(function(res){
      if (!res || !res.ok) throw new Error('HTTP ' + (res ? res.status : '?'));
      return res.json();
    })
    .then(function(json){ done(); return neisMeals(json); })
    .then(null, function(err){ done(); throw err; });
}
function loadLunch(force){
  if (lunch.loading) return;
  var range = lunchRange();
  var cache = readLunchCache();
  var jobs = [], changed = false;
  KIDS.forEach(function(kid){
    var s = schoolOf(kid);
    var key = s.atpt + '-' + s.code + '-' + range.from + '-' + range.to;
    var hit = cache[key];
    if (!force && hit && Array.isArray(hit.rows) && (Date.now() - numOf(hit.at, 0) < LUNCH_TTL)){
      var st = hit.rows.length ? 'ok' : 'none';
      if (lunch.status[kid] !== st || lunch.data[kid] !== hit.rows) changed = true;
      lunch.data[kid] = hit.rows;
      lunch.status[kid] = st;
      lunch.at[kid] = numOf(hit.at, 0);
      return;
    }
    if (lunch.status[kid] !== 'ok' || force) lunch.status[kid] = 'loading';
    jobs.push({ kid:kid, key:key, s:s });
  });
  if (!jobs.length){ if (changed) paintLunch(); return; }
  lunch.loading = true;
  var left = jobs.length;
  jobs.forEach(function(job){
    fetchLunch(job.s, range)
      .then(function(res){
        var rows = res.rows.map(parseMealRow).filter(function(r){ return r.dishes.length; });
        lunch.data[job.kid] = rows;
        lunch.status[job.kid] = rows.length ? 'ok' : 'none';
        lunch.at[job.kid] = Date.now();
        var c = readLunchCache();
        c[job.key] = { at: Date.now(), code: res.code, rows: rows };
        writeLunchCache(c);
      })
      .then(null, function(){ lunch.status[job.kid] = 'error'; })
      .then(function(){
        left--;
        if (left <= 0){ lunch.loading = false; paintLunch(); }
      });
  });
}

function paintLunch(){

/* ============================ 성장 기록 (키·몸무게·BMI 백분위) ============================ */
function ageMonthsAt(birth, dateStr){
  if (!birth || !isValidYmd(dateStr)) return null;
  var bp = String(birth).split('-'), dp = String(dateStr).split('-');
  if (bp.length < 2) return null;
  var by = Number(bp[0]), bm = Number(bp[1]), bd = bp.length > 2 ? Number(bp[2]) : 15;
  var dy = Number(dp[0]), dm = Number(dp[1]), dd = Number(dp[2]);
  if (!by || !bm || !dy || !dm) return null;
  var months = (dy - by) * 12 + (dm - bm);
  if (dd < bd) months -= 1;
  return months < 0 ? null : months;
}
function lmsAt(arr, months){
  var M = GROWTH_MONTHS;
  if (!arr || !arr.length) return null;
  if (months <= M[0]) return arr[0];
  if (months >= M[M.length - 1]) return arr[arr.length - 1];
  var i = 0;
  while (i < M.length - 2 && M[i + 1] <= months) i++;
  var t = (months - M[i]) / (M[i + 1] - M[i]);
  var a = arr[i], b = arr[i + 1];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function zScoreOf(x, lms){
  if (!lms || !(x > 0)) return 0;
  var L = lms[0], Mv = lms[1], S = lms[2];
  if (!Mv || !S) return 0;
  if (Math.abs(L) < 0.000001) return Math.log(x / Mv) / S;
  return (Math.pow(x / Mv, L) - 1) / (L * S);
}
function normCdf(z){
  var x = Math.abs(z), t = 1 / (1 + 0.2316419 * x);
  var d = 0.3989423 * Math.exp(-x * x / 2);
  var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function pctOf(x, lms){
  if (!(x > 0) || !lms) return null;
  var p = normCdf(zScoreOf(x, lms)) * 100;
  return Math.max(0.1, Math.min(99.9, p));
}
function fmtPct(p){
  if (typeof p !== 'number' || !isFinite(p)) return '';
  if (p < 1) return '1% 미만';
  if (p > 99) return '99% 이상';
  return Math.round(p) + '%';
}
function bmiOf(h, w){
  if (!(h > 0) || !(w > 0)) return 0;
  return Math.round(w / Math.pow(h / 100, 2) * 10) / 10;
}
function growthStats(kid, rec){
  var months = ageMonthsAt(state.births[kid], rec.date);
  var out = { bmi: bmiOf(rec.height, rec.weight), months: months, h: null, w: null, b: null };
  if (months === null) return out;
  if (rec.height > 0) out.h = pctOf(rec.height, lmsAt(GROWTH_LMS.h, months));
  if (rec.weight > 0) out.w = pctOf(rec.weight, lmsAt(GROWTH_LMS.w, months));
  if (out.bmi > 0) out.b = pctOf(out.bmi, lmsAt(GROWTH_LMS.b, months));
  return out;
}
function bmiLabel(p){
  if (typeof p !== 'number') return '';
  if (p >= 95) return '비만 범위';
  if (p >= 85) return '과체중 범위';
  if (p < 5) return '저체중 범위';
  return '정상 범위';
}
function growthChartSVG(kid, metric){
  var list = (state.growth[kid] || []).slice().sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var pts = [];
  list.forEach(function(g){
    var v = metric === 'b' ? (bmiOf(g.height, g.weight) || 0) : metric === 'w' ? (g.weight || 0) : (g.height || 0);
    if (v > 0) pts.push({ date: g.date, v: v });
  });
  if (pts.length < 2) return '';
  var W = 320, H = 106, padX = 12, padTop = 12, padBot = 12;
  var vs = pts.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi - lo < 1){ hi = Math.max(hi, lo + 1); lo = Math.max(0, lo - 1); }
  var span = hi - lo;
  var unit = metric === 'b' ? '' : metric === 'w' ? 'kg' : 'cm';
  var xAt = function(i){ return pts.length === 1 ? W / 2 : padX + (W - padX * 2) * i / (pts.length - 1); };
  var yAt = function(v){ return H - padBot - (H - padTop - padBot) * (v - lo) / span; };
  var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + xAt(i).toFixed(1) + ' ' + yAt(p.v).toFixed(1); }).join(' ');
  var area = d + ' L' + xAt(pts.length - 1).toFixed(1) + ' ' + (H - padBot) + ' L' + xAt(0).toFixed(1) + ' ' + (H - padBot) + ' Z';
  var dots = pts.map(function(p, i){
    return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(p.v).toFixed(1) + '" r="3.3" fill="#5CBD84" stroke="#fff" stroke-width="1.4"/>';
  }).join('');
  var first = pts[0].date, lastD = pts[pts.length - 1].date;

/* ============================ 발로란트 티어 · 스킨 보관함 ============================ */
var SKIN_CACHE_KEY = 'uri-family-record:skins:v1';
var SKIN_TTL = 7 * 24 * 60 * 60 * 1000;
var skins = { status:'idle', items:null, at:0, loading:false };
var valQuery = '';

function valCurAccount(){
  var accs = state.valorant.accounts || [];
  var cur = null;
  accs.forEach(function(a){ if (a.id === state.valorant.cur) cur = a; });
  return cur || accs[0] || null;
}
function valProfileUrl(acc){
  if (!acc || !acc.name) return '';
  return 'https://tracker.gg/valorant/profile/riot/' + encodeURIComponent(acc.name + '#' + (acc.tag || '')) + '/overview';
}
function valTierOf(accId){
  var t = state.valorant.tiers && state.valorant.tiers[accId];
  return isObj(t) ? t : null;
}
function readSkinCache(){
  try {
    var o = JSON.parse(localStorage.getItem(SKIN_CACHE_KEY) || 'null');
    if (!isObj(o) || !Array.isArray(o.items) || !o.items.length) return null;
    return o;
  } catch (e){ return null; }
}
function writeSkinCache(items){
  try { localStorage.setItem(SKIN_CACHE_KEY, JSON.stringify({ at: Date.now(), items: items })); } catch (e){}
}
function loadSkins(){
  if (skins.loading) return;
  if (skins.items && (Date.now() - skins.at < SKIN_TTL)) return;
  var cached = readSkinCache();
  if (cached && Date.now() - numOf(cached.at, 0) < SKIN_TTL){
    skins.items = cached.items; skins.at = numOf(cached.at, 0); skins.status = 'ok';
    return;
  }
  var fetchFn = null;
  try { fetchFn = window.fetch || null; } catch (e){ fetchFn = null; }
  if (!fetchFn){ skins.status = 'error'; return; }
  skins.loading = true;
  skins.status = 'loading';
  paintSkins();
  fetchFn('https://valorant-api.com/v1/weapons/skins?language=ko-KR', { cache:'no-store' })
    .then(function(res){
      if (!res || !res.ok) throw new Error('HTTP ' + (res ? res.status : '?'));
      return res.json();
    })
    .then(function(json){
      var rows = json && Array.isArray(json.data) ? json.data : [];
      var seen = {}, out = [];
      rows.forEach(function(r){
        if (!isObj(r)) return;
        var nm = strOf(r.displayName, '').trim();
        var icon = strOf(r.displayIcon, '');
        if (!nm || !icon || seen[nm]) return;
        seen[nm] = 1;
        var lv = (Array.isArray(r.levels) && r.levels[0]) ? strOf(r.levels[0].displayIcon, '') : '';
        out.push({ id: strOf(r.uuid, ''), name: nm, icon: icon, alt: (lv && lv !== icon) ? lv : '' });
      });
      out.sort(function(a, b){ return a.name.localeCompare(b.name); });
      skins.items = out; skins.at = Date.now(); skins.status = 'ok';
      writeSkinCache(out);
    })
    .then(null, function(){ skins.status = 'error'; })
    .then(function(){ skins.loading = false; paintSkins(); });
}
function skinResultsHTML(){
  if (skins.status === 'loading') return '<div class="val-empty">스킨 목록을 불러오는 중이에요… (처음 한 번만 걸려요)</div>';
  if (skins.status === 'error') return '<div class="val-empty">스킨 목록을 불러오지 못했어요. 잠시 뒤 다시 검색해 주세요.</div>';
  if (!skins.items) return '<div class="val-empty">스킨 이름을 검색해 보세요 (예: 프라임, 아라미스)</div>';
  var q = String(valQuery || '').trim().toLowerCase();
  var have = {};
  var curAcc = valCurAccount();
  var ownedList = (curAcc && isObj(state.valorant.skins) && Array.isArray(state.valorant.skins[curAcc.id])) ? state.valorant.skins[curAcc.id] : [];
  ownedList.forEach(function(k){ have[k.id] = 1; });
  var out;
  if (!q){
    out = skins.items.slice(0, 9);
  } else {
    var starts = [], contains = [];
    skins.items.forEach(function(it){
      var nm = it.name.toLowerCase();
      if (nm.indexOf(q) === 0) starts.push(it);
      else if (nm.indexOf(q) >= 0) contains.push(it);
    });
    out = starts.concat(contains).slice(0, 24);
  }
  if (!out.length) return '<div class="val-empty">"' + esc(valQuery) + '"와 맞는 스킨이 없어요</div>';
  return out.map(function(it){
    var owned = have[it.id];
    return '<button class="val-pick" data-act="val-skin-add" data-id="' + esc(it.id) + '"' + (owned ? ' disabled' : '') + ' aria-label="' + esc(it.name) + ' 담기">' +
      '<img src="' + esc(it.icon) + '" alt="" loading="lazy" referrerpolicy="no-referrer"' + (it.alt ? ' data-alt="' + esc(it.alt) + '"' : '') + '>' +
      '<span class="nm">' + esc(it.name) + '</span>' +
    '</button>';
  }).join('');
}

function skinImgFix(){
  if (typeof document === 'undefined' || !document.querySelectorAll) return;
  var list = document.querySelectorAll('img[data-alt]');
  Array.prototype.forEach.call(list, function(img){
    var swap = function(){
      var alt = img.getAttribute('data-alt');
      if (!alt) return;
      img.removeAttribute('data-alt');
      if (img.naturalWidth && img.naturalWidth === img.naturalHeight){ img.src = alt; }
    };
    if (img.complete) swap();
    else img.addEventListener('load', swap);
  });
}
function paintSkins(){
  if (state.ui.tab !== 'play') return;
  var box = document.getElementById('valRes');

var ALB_WHO = ['dad', 'mom', 'taeju', 'juwon'];
var ALB_VIDEO_MAX = 7 * 1024 * 1024;             /* 사진첩에 바로 담을 수 있는 영상 파일 크기(RTDB 한 값 한도) */
var ALB_RTDB_VIDEO_CHARS = 9500000;              /* RTDB 한 값에 담을 수 있는 base64 길이 한계(약 7MB 원본) */
var albDraft = { img:'', bytes:0, w:0, h:0, busy:false, file:null, thumb:'', dur:0, vbytes:0 };
var albBlobUrl = '';

function albList(){

/* 영상 파일 본체는 state에 넣지 않고 방 옆 videos/에 따로 보관해요(사진첩에는 썸네일만) */
function albVideoBase(){ return String(ROOM_PATH || '').replace(/\/state$/, '') + '/videos'; }
function albDbUrl(){ return FB_CONFIG.databaseURL; }
/* 저장된 기록을 안전하게 다듬어요(사진·썸네일은 data:image, 링크는 http(s)만) */
function albImgOk(v, max){
  return !!v && typeof v === 'string' && v.length < (max || 400000) && /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(v.slice(0, 40));
}
function albReadList(list){
  var seen = {}, out = [];
  arrOf(list).forEach(function(x){
    if (!isObj(x)) return;
    var id = strOf(x.id, '').slice(0, 40);
    if (!id || seen[id]) return;
    seen[id] = 1;
    var img = albImgOk(strOf(x.img, '')) ? x.img : '';
    var thumb = albImgOk(strOf(x.thumb, ''), 200000) ? x.thumb : '';
    var vid = strOf(x.vid, '').replace(/\s+/g, '').slice(0, 300);
    if (vid && !/^https?:\/\//i.test(vid)) vid = '';
    var videoId = strOf(x.videoId, '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
    var at = numOf(x.at, 0);
    if (!at) at = Date.now() - out.length * 1000;
    var day = isValidYmd(x.date) ? x.date : ymd(new Date(at));
    var kind = (x.type === 'video' || videoId) ? 'video' : 'photo';
    var cat = (x.kind === 'valorant') ? 'valorant' : 'family';
    out.push({
      id: id,
      who: BY_ID[x.who] ? x.who : (BY_ID[x.author] ? x.author : 'dad'),
      by: BY_ID[x.by] ? x.by : '',
      title: trimStr(x.title, 40),
      memo: strOf(x.memo, '').replace(/\r/g, '').replace(/[ \t]+/g, ' ').trim().slice(0, 200),
      img: img, vid: vid, date: day, at: at,
      type: kind,
      kind: cat,
      thumb: thumb,
      videoId: videoId,
      videoMime: /^video\/[a-z0-9.+-]{2,30}$/i.test(strOf(x.videoMime, '')) ? x.videoMime : 'video/mp4',
      size: Math.max(0, numOf(x.size, 0)),
      dur: Math.max(0, Math.min(600, Math.round(numOf(x.dur, 0))))
    });
  });
  out.sort(function(a, b){ return numOf(b.at, 0) - numOf(a.at, 0); });
  return out.slice(0, ALB_MAX);
}
/* 유튜브 주소에서 영상 아이디를 뽑아요(watch·youtu.be·shorts·live·embed) */
function albYtId(url){
  var m = String(url || '').match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{6,20})/i);
  return m ? m[1] : '';

function albUrlOk(u){ return /^https?:\/\/[^\s]+$/i.test(String(u || '')); }
function albThumb(it){
  if (it.img) return it.img;
  if (it.thumb) return it.thumb;
  var yt = albYtId(it.vid);

}
function albDateStr(it){

  var p = parseYmd(d);
  return (p.getMonth() + 1) + '월 ' + p.getDate() + '일';
}
/* 올린 날짜·시각(실제 업로드 시각) */
function albTimeStr(it){
  var d = new Date(numOf(it && it.at, Date.now()));
  return pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());

function albFullTimeStr(it){

}
function albByOf(it){ return BY_ID[it && it.by] ? it.by : ''; }
function albKb(b){ return Math.round(numOf(b, 0) / 1024) + 'KB'; }
function albMb(b){ return (Math.round(numOf(b, 0) / 1048576 * 10) / 10) + 'MB'; }
function albDataBytes(d){
  if (typeof d !== 'string') return 0;
  var i = d.indexOf(',');
  if (i < 0) return d.length;
  return Math.round((d.length - i - 1) * 3 / 4);
}
function albBadge(it){

var ALB_VIDEO_SIZE_TIP = '짧은 영상(7MB 이하)은 바로 올라가고, 더 큰 영상은 유튜브·구글 드라이브·원드라이브 링크로 올리면 돼요';

/* ---------------- 사진 고르기 → 캔버스로 줄여서 저장(긴 변 1080px · JPEG · 200KB 이하 목표) ---------------- */
function albPickFile(input){
  var file = input && input.files && input.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type || '')){ toast('사진 파일만 올릴 수 있어요'); input.value = ''; return; }
  var info = document.getElementById('albFileInfo');
  var prev = document.getElementById('albPrev');
  albDraft.busy = true;
  if (info) info.textContent = '사진 줄이는 중이에요… (' + albKb(numOf(file.size, 0)) + ')';
  if (prev) prev.innerHTML = '<span class="tiny">…</span>';
  albShrink(file, function(res){
    albDraft.busy = false;
    if (!res || !res.dataUrl){
      albDraft.img = ''; albDraft.bytes = 0;
      if (info) info.textContent = '이 사진은 불러오지 못했어요. 다른 사진으로 골라 주세요.';
      if (prev) prev.innerHTML = '📷';
      return;
    }
    albDraft.img = res.dataUrl; albDraft.bytes = res.bytes; albDraft.w = res.w; albDraft.h = res.h;
    if (prev) prev.innerHTML = '<img src="' + res.dataUrl + '" alt="">';
    if (info) info.textContent = '사진 ' + albKb(res.bytes) + ' · ' + res.w + '×' + res.h + ' (자동으로 줄였어요)';
  });
}
function albShrink(file, cb){
  var url = '';
  try { url = URL.createObjectURL(file); } catch (e){ url = ''; }
  if (!url){
    var fr = new FileReader();
    fr.onload = function(){ albShrinkSrc(String(fr.result || ''), cb); };
    fr.onerror = function(){ cb(null); };
    fr.readAsDataURL(file);
    return;
  }
  albShrinkSrc(url, function(res){ try { URL.revokeObjectURL(url); } catch (e){} cb(res); });
}
function albShrinkSrc(src, cb){
  var img = new Image();
  var done = false;
  var finish = function(res){ if (done) return; done = true; cb(res); };
  img.onerror = function(){ finish(null); };
  img.onload = function(){
    if (done) return;
    var w = img.naturalWidth || img.width || 0;
    var h = img.naturalHeight || img.height || 0;
    if (!w || !h) return finish(null);
    var plan = [[ALB_SIDE, 0.78], [ALB_SIDE, 0.66], [960, 0.7], [860, 0.62], [760, 0.55]];
    var best = null;
    for (var i = 0; i < plan.length; i++){
      var sc = Math.min(1, plan[i][0] / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * sc));
      var ch = Math.max(1, Math.round(h * sc));
      var d = albCanvasJpeg(img, cw, ch, plan[i][1]);
      if (!d) continue;
      best = { dataUrl: d, bytes: albDataBytes(d), w: cw, h: ch };
      if (best.bytes <= ALB_PHOTO_BYTES) break;
    }
    finish(best);
  };
  img.src = src;
  setTimeout(function(){ finish(null); }, 15000);
}
function albCanvasJpeg(source, w, h, q){
  try {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    if (!ctx) return '';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, w, h);
    if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(source, 0, 0, w, h);
    return c.toDataURL('image/jpeg', q);
  } catch (e){ return ''; }
}

function albVideoThumb(file, cb){
  var url = '';
  try { url = URL.createObjectURL(file); } catch (e){ url = ''; }
  if (!url) return cb(null);
  var v = document.createElement('video');
  var done = false;
  var finish = function(res){
    if (done) return;
    done = true;
    try { v.pause(); } catch (e){}
    try { v.removeAttribute('src'); v.load(); } catch (e){}
    try { URL.revokeObjectURL(url); } catch (e){}
    cb(res);
  };
  var grab = function(){
    var w = v.videoWidth || 0, h = v.videoHeight || 0;
    if (!w || !h) return finish(null);
    var plan = [[480, 0.72], [420, 0.66], [360, 0.6]];
    var best = null;
    for (var i = 0; i < plan.length; i++){
      var sc = Math.min(1, plan[i][0] / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
      var d = albCanvasJpeg(v, cw, ch, plan[i][1]);
      if (!d) continue;
      best = { thumb: d, bytes: albDataBytes(d) };
      if (best.bytes <= 30000) break;
    }
    finish(best ? { thumb: best.thumb, dur: Math.max(0, Math.round(numOf(v.duration, 0))), w: w, h: h } : null);
  };
  v.muted = true;
  v.playsInline = true;
  v.preload = 'auto';
  v.setAttribute('playsinline', '');
  v.addEventListener('loadeddata', function(){
    try { v.currentTime = Math.min(0.5, Math.max(0, (v.duration || 1) / 2)); } catch (e){}
    setTimeout(grab, 260);
  });
  v.addEventListener('seeked', function(){ setTimeout(grab, 60); });
  v.addEventListener('error', function(){ finish(null); });
  setTimeout(function(){ finish(null); }, 12000);
  v.src = url;
}

/* ---------------- 영상 보관: 방 옆 videos/{id} 에만 저장(사진첩엔 썸네일만) ---------------- */
function albStoreVideo(videoId, file, dataUrl, cb){
  if (dataUrl.length > ALB_RTDB_VIDEO_CHARS) return cb(false, ALB_VIDEO_SIZE_TIP);
  var payload = {
    id: videoId, at: Date.now(),
    mime: file.type || 'video/mp4',
    size: numOf(file.size, 0),
    name: String(file.name || '').slice(0, 80),
    data: dataUrl
  };
  fetch(albDbUrl() + '/' + albVideoBase() + '/' + videoId + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(res){
    if (!res.ok) throw new Error('HTTP ' + res.status);
    cb(true);
  }).then(null, function(err){
    cb(false, '영상을 올리지 못했어요' + (err && err.message ? ' (' + err.message + ')' : '') + '. 잠시 뒤 다시 해 주세요.');
  });
}
function albReadFileDataUrl(file, cb){
  var fr = new FileReader();
  fr.onload = function(){ cb(String(fr.result || '')); };
  fr.onerror = function(){ cb(''); };
  try { fr.readAsDataURL(file); } catch (e){ cb(''); }
}
function albDeleteVideo(it){
  if (!it || !it.videoId) return;
  try { fetch(albDbUrl() + '/' + albVideoBase() + '/' + it.videoId + '.json', { method: 'DELETE' }).then(null, function(){}); } catch (e){}
}
function albDataUrlToBlob(d){
  var i = String(d).indexOf(',');
  var meta = String(d).slice(0, i);
  var b64 = String(d).slice(i + 1);
  var mime = (meta.match(/:(.*?);/) || [])[1] || 'video/mp4';
  var bin = atob(b64);
  var len = bin.length, u8 = new Uint8Array(len);
  for (var k = 0; k < len; k++) u8[k] = bin.charCodeAt(k);
  return new Blob([u8], { type: mime });
}
function albMountVideo(box, it){
  if (!box || !it.videoId) return;
  fetch(albDbUrl() + '/' + albVideoBase() + '/' + it.videoId + '.json', { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    if (!j || !j.data) throw new Error('empty');
    var url = '';
    try {
      albBlobUrl = URL.createObjectURL(albDataUrlToBlob(j.data));
      url = albBlobUrl;
    } catch (e){ url = j.data; }
    box.innerHTML = '<video class="alb-video" controls playsinline autoplay preload="metadata" src="' + url + '"></video>';
  }).then(null, function(){
    box.innerHTML = '<div class="alb-vload">🎬 영상을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>';
  });
}

function saveAlbum(){
  if (albDraft.busy){ toast('사진·영상 준비 중이에요. 조금만 기다려 주세요'); return; }
  if (albList().length >= ALB_MAX){ closeModal(); toast('사진첩이 가득 찼어요(' + ALB_MAX + '개)'); return; }
  var kindEl = document.getElementById('albKind');
  var whoEl = document.getElementById('albWho');
  var byEl = document.getElementById('albBy');
  var tEl = document.getElementById('albTitle');
  var mEl = document.getElementById('albMemo');
  var vEl = document.getElementById('albVid');
  var who = (whoEl && BY_ID[whoEl.value]) ? whoEl.value : 'dad';
  var by = (byEl && BY_ID[byEl.value]) ? byEl.value : albByDefault();
  var kind = (kindEl && kindEl.value === 'valorant') ? 'valorant' : 'family';
  var title = String(tEl ? tEl.value : '').replace(/\s+/g, ' ').trim().slice(0, 40);
  var memo = String(mEl ? mEl.value : '').replace(/\r/g, '').replace(/[ \t]+/g, ' ').trim().slice(0, 200);
  var vid = String(vEl ? vEl.value : '').replace(/\s+/g, '').slice(0, 300);
  var file = albDraft.file;
  if (vid && !albUrlOk(vid)){ toast('링크는 http:// 또는 https:// 로 시작해야 해요'); return; }
  if (!title && !albDraft.img && !vid && !file){ toast('제목이나 사진·영상 중 하나는 있어야 해요'); return; }
  var now = Date.now();
  var item = {
    id: 'alb' + uid(),
    who: who,
    by: by,
    kind: kind,
    title: title || (albDraft.img ? '추억 사진' : '추억 영상'),
    memo: memo,
    img: albDraft.img || '',
    vid: vid,
    date: ymd(new Date(now)),
    at: now,
    type: (file || vid) ? 'video' : 'photo'
  };
  if (!file){ albCommit(item, who); return; }
  /* 영상 파일: 썸네일은 기록에, 영상 본체는 videos/에 따로 */
  var videoId = 'v' + uid();
  albDraft.busy = true;
  albSaveBtnState(true, '영상 올리는 중…');
  albReadFileDataUrl(file, function(dataUrl){
    if (!dataUrl){
      albDraft.busy = false; albSaveBtnState(false);
      toast('영상 파일을 읽지 못했어요');
      return;
    }
    albStoreVideo(videoId, file, dataUrl, function(ok, err){
      if (!ok){
        albDraft.busy = false; albSaveBtnState(false);
        toast(err || '영상을 올리지 못했어요');
        return;
      }
      item.videoId = videoId;
      item.videoMime = file.type || 'video/mp4';
      item.size = numOf(file.size, 0);
      item.dur = albDraft.dur || 0;
      item.thumb = albDraft.thumb || '';
      albDraft.busy = false;
      albCommit(item, who);
    });
  });
}

  albList().unshift(item);
  if (BY_ID[item.by]) state.ui.albumBy = item.by;
  if (BY_ID[item.who]) state.ui.albumWho = item.who;
  state.ui.albumKind = item.kind === 'valorant' ? 'valorant' : 'family';
  albDraft = { img:'', bytes:0, w:0, h:0, busy:false, file:null, thumb:'', dur:0, vbytes:0 };
  state.ui.albumFilter = item.kind === 'valorant' ? 'val' : 'all';
  closeModal();
  save(); render();
  toast(person(who).name + ' 추억을 담았어요 · 가족 모두에게 보여요');
}

function mergeById(remoteArr, localArr){
  var seen = {}, out = [];

  });
  (arrOf(localArr)).forEach(function(x){
    if (!isObj(x) || !x.id || seen[x.id] || DEFAULT_IDS[x.id]) return;

function fbLoadScript(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src;
    s.async = true;
    var settled = false;
    s.onload = function(){ if (!settled){ settled = true; resolve(); } };
    s.onerror = function(){ if (!settled){ settled = true; reject(new Error(src + ' 불러오기 실패')); } };
    document.head.appendChild(s);
    setTimeout(function(){ if (!settled){ settled = true; reject(new Error(src + ' 시간 초과')); } }, 15000);
  });
}

function fbInit(){

function fbPush(force){
  if (!fb.ready || !fb.ref) return;

  var payload = fbShared();
  payload.v = SCHEMA_VERSION;
  payload.meta = { at: Date.now(), by: DEVICE_ID };

    var p = fb.ref.set(payload);

      p.then(null, function(err){
        fb.lastHash = null;
        fbSetStatus('offline', err);
        fbWriteWarn();
        fbScheduleRetry();

/* 서버가 비어 있을 때: 두 기기가 동시에 열어도 한 번만 씨앗을 심도록 트랜잭션을 써요 */
function fbSeed(){
  if (fb.seeding || !fb.ready || !fb.ref) return;
  fb.seeding = true;
  var build = function(){
    var payload = fbShared();
    payload.v = SCHEMA_VERSION;
    payload.meta = { at: Date.now(), by: DEVICE_ID };
    return payload;
  };
  var release = function(){ setTimeout(function(){ fb.seeding = false; }, 1000); };
  try {
    fb.ref.transaction(function(cur){ return cur === null ? build() : undefined; }, function(err, committed, snap){
      release();
      if (err){ fbSetStatus('offline', err); return; }
      if (committed){
        fb.lastSyncAt = Date.now();
        /* 심는 사이에 바뀐 내용이 있을 수 있으니 한 번 더 현재 상태로 맞춰요 */
        fb.lastHash = null;
        queuePush();
        paintSyncChip();
        return;
      }
      var v = snap && snap.val();
      if (isObj(v)) fbOnRemote(v);
      else fbPush(true);
    });
  } catch (e){
    release();
    fbPush(true);
  }

  fb.lastSyncAt = Date.now();

  if (after !== before){
    saveLocal();
    softRender();
    fbFlash();
  }
  fb.lastHash = after;
  if (firstJoin) markJoined();
  if (rescued || merged || needPush){ fb.lastHash = null; queuePush(); }
  paintSyncChip();
}

function fbReconnect(){
  if (!fb.ready){ fb.loading = false; fbConnect(); return; }
  fbSetStatus('connecting');
  try { fb.db.goOnline(); } catch (e){}
  if (fb.ref){
    fb.ref.once('value', function(snap){ fbOnRemote(snap.val()); }, function(err){ fbSetStatus('offline', err); });
  }
  toast('다시 연결을 시도하고 있어요');
}

/* 다른 기기 기록이 들어와도 보고 있던 화면과 적던 글이 그대로 유지되도록 다시 그리기 */
function inputKeyOf(el){
  if (!el) return null;
  if (el.id) return '#' + el.id;
  var m = el.getAttribute && el.getAttribute('data-meal');
  return m ? '[data-meal="' + m + '"]' : null;
}
function softRender(){
  var ae = document.activeElement;
  var keep = null;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
    var key = inputKeyOf(ae);
    if (key) keep = { key: key, value: ae.value, start: ae.selectionStart, end: ae.selectionEnd };
  }
  var list = document.getElementById('chatList');
  var atBottom = list ? (list.scrollHeight - list.scrollTop - list.clientHeight) < 48 : false;
  render();
  if (keep){
    var el = document.querySelector(keep.key);
    if (el && typeof el.value === 'string'){
      el.value = keep.value;
      try { el.focus(); el.setSelectionRange(keep.start, keep.end); } catch (e){}
    }
  }
  if (atBottom){
    var l2 = document.getElementById('chatList');
    if (l2) l2.scrollTop = l2.scrollHeight;
  }
}

/* ---------------------------- 시작 ---------------------------- */
function init(){
  if (!readStore()) save();
  render();
  if (state.ui.tab === 'home') loadWeather();
  paintSyncChip();
  fbConnect();
  window.addEventListener('online', function(){ if (!fb.ready) fbConnect(); else fbReconnect(); });
  var fileInput = document.getElementById('importFile');
  if (fileInput){
    fileInput.addEventListener('change', function(){
      if (fileInput.files && fileInput.files[0]) handleImportFile(fileInput.files[0]);
    });
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
